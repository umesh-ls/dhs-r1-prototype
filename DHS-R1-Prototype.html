<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DHS · R1 (topic-driven)</title>
<style>
  :root{--maroon:#8B0000;--maroon2:#6B0000;--pink:#F0DDDD;--side:#F8F8F8;--brand:#E8E8E8;--txt:#374151;--ink:#111827;--mut:#6b7280;--mut2:#9ca3af;--bd:#e5e7eb;--bd2:#d1d5db;--surface:#ffffff;--surface2:#f8f8f8;--soft:#fcfcfd;--page:#f3f4f6;--onaccent:#ffffff;--shadow:rgba(0,0,0,.06)}
  [data-theme="dark"]{--maroon:#cfa14e;--maroon2:#e0b568;--pink:#2a2418;--side:#1a1710;--brand:#201d15;--txt:#e8e1d0;--ink:#f6f1e6;--mut:#a89f8b;--mut2:#8a8270;--bd:#35302a;--bd2:#453f34;--surface:#201d15;--surface2:#1a1710;--soft:#2a2418;--page:#14120d;--onaccent:#1a1710;--shadow:rgba(0,0,0,.5)}
  *{margin:0;padding:0;box-sizing:border-box;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
  body{background:var(--page);color:var(--txt);height:100vh;overflow:hidden}
  .main{background:var(--page)}
  .app{display:flex;height:100vh}
  /* sidebar */
  .side{width:222px;background:var(--side);border-right:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0}
  .brand{background:var(--surface);padding:15px 13px 13px;text-align:center;position:relative}
  .brand::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--maroon)}
  .brand .t{font-size:18px;font-weight:800;letter-spacing:3px;color:var(--maroon);line-height:1}
  .brand .s{font-size:8.5px;color:var(--mut2);margin-top:4px;text-transform:uppercase;letter-spacing:1.5px}
  .who{padding:11px 12px 12px;border-bottom:1px solid var(--bd);font-size:11.5px;background:var(--side)}
  .who .n{font-weight:700;color:var(--ink);display:flex;align-items:center;flex-wrap:wrap;gap:5px;line-height:1.3}
  .who .o{color:var(--mut);margin-top:2px}
  .who .rpill{font-size:8.5px;font-weight:700;background:var(--pink);color:var(--maroon);border-radius:999px;padding:2px 7px;letter-spacing:.3px}
  .who select{width:100%;margin-top:8px;font-size:11px;padding:6px 8px;border:1px solid var(--bd2);border-radius:7px;background:var(--surface);color:var(--ink);cursor:pointer}
  .who select:hover{border-color:var(--maroon)}
  .sidefoot{padding:10px 12px;border-top:1px solid var(--bd)}
  .thm{display:flex;align-items:center;gap:7px;width:100%;justify-content:center;font-size:11.5px;font-weight:600;color:var(--mut);background:var(--surface);border:1px solid var(--bd2);border-radius:8px;padding:7px;cursor:pointer}
  .thm:hover{border-color:var(--maroon);color:var(--maroon)}
  .thm svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .nav{padding:10px 9px;overflow-y:auto;flex:1}
  .ni{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:6px;font-size:13.5px;color:var(--txt);cursor:pointer;margin-bottom:3px;border:0;background:none;width:100%;text-align:left}
  .ni:hover{background:var(--soft)}
  .ni.on{background:var(--pink);color:var(--maroon);font-weight:700}
  .ni .ic{width:18px;height:18px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;color:var(--mut)}
  .ni.on .ic{color:var(--maroon)}
  .ni:hover .ic{color:var(--mut)}.ni.on:hover .ic{color:var(--maroon)}
  .ni .ic svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .ni .cnt{margin-left:auto;background:var(--maroon);color:var(--onaccent);border-radius:999px;font-size:10px;padding:1px 7px;font-weight:700}
  .nl{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--mut);padding:13px 10px 4px;border-top:1px solid #dddfeb;margin-top:9px}
  .main{flex:1;overflow-y:auto;padding:24px 30px}
  .pt{font-size:21px;font-weight:800;color:var(--ink);letter-spacing:-.01em}.ps{font-size:12.5px;color:var(--mut);margin:3px 0 18px}
  /* hero */
  .hero{background:var(--surface);border:1px solid var(--bd2);border-radius:13px;padding:24px;text-align:center;margin-bottom:18px}
  .hero .h{font-size:15px;color:var(--ink);font-weight:700}
  .sb{display:flex;align-items:center;gap:9px;background:var(--surface);border:2px solid var(--maroon);border-radius:11px;padding:11px 14px;max-width:600px;margin:11px auto 0;box-shadow:0 2px 10px rgba(139,0,0,.06)}
  .sb input{flex:1;border:0;outline:0;font-size:14px;color:var(--ink);background:none}
  .sb .go{background:var(--maroon);color:var(--onaccent);border-radius:8px;padding:8px 15px;font-size:12.5px;font-weight:600;cursor:pointer;border:0}
  .chips{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-top:13px}
  .chip{background:var(--surface);border:1px solid var(--bd2);border-radius:999px;padding:6px 12px;font-size:12px;color:#6b3a3a;cursor:pointer}
  .chip:hover{border-color:var(--maroon);color:var(--maroon)}
  /* console strip */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:16px}
  .kpi{background:var(--surface);border:1px solid var(--bd2);border-radius:10px;padding:13px 14px}
  .kpi .l{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--mut2)}
  .kpi .v{font-size:24px;font-weight:800;color:var(--ink);margin-top:2px;letter-spacing:-.02em;line-height:1.05}
  .kpi .sub{font-size:10px;color:var(--mut2)}
  .card{background:var(--surface);border:1px solid var(--bd2);border-radius:10px;padding:15px}
  .card h3{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:9px}
  .ri{display:flex;justify-content:space-between;align-items:center;padding:9px 2px;border-bottom:1px solid var(--bd);font-size:12.5px;cursor:pointer}
  .ri:last-child{border-bottom:0}.ri:hover{background:var(--soft)}
  .badge{font-size:10px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap}
  .ba{background:#fef3c7;color:#92400e}.bg{background:#dcfce7;color:#166534}.bb{background:#dbeafe;color:#1e40af}
  .bgy{background:#e5e7eb;color:var(--txt)}.bp{background:#ede9fe;color:#6d28d9}.br{background:#fee2e2;color:#991b1b}
  /* picker */
  .grp{margin-bottom:16px}
  .grph{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--maroon);margin-bottom:6px}
  .grph .c{color:#c9a}
  .topic{background:var(--surface);border:1px solid var(--bd2);border-radius:8px;padding:10px 13px;margin-bottom:6px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .topic:hover{border-color:var(--maroon);box-shadow:0 2px 8px rgba(139,0,0,.06)}
  .topic .n{font-size:13px;font-weight:600;color:var(--ink)}
  .topic .m{font-size:11px;color:var(--mut2);margin-top:1px}
  .topic .tags{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
  /* topic summary */
  .kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:12.5px;margin-top:4px}
  .kv .k{color:var(--mut)}.kv .v{color:var(--ink);font-weight:600}
  .flow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:10px 0}
  .node{background:var(--pink);color:var(--maroon);border-radius:7px;padding:6px 11px;font-size:11.5px;font-weight:600}
  .node.end{background:#dcfce7;color:#166534}.node.ho{background:#e0e7ff;color:#3730a3}
  .ar{color:#d1cfcf;font-weight:700}
  .btn{border:0;border-radius:8px;padding:9px 15px;font-size:13px;font-weight:600;cursor:pointer}
  .btnp{background:var(--maroon);color:var(--onaccent)}.btnp:hover{background:var(--maroon2)}
  .btns{background:var(--surface);border:1px solid var(--bd);color:var(--txt)}
  .note{font-size:11.5px;color:#92400e;background:#fffbeb;border:1px solid #fde68a;border-radius:7px;padding:8px 11px;margin-top:10px}
  .empty{font-size:12.5px;color:var(--mut2);padding:14px;text-align:center}
    .backbtn{font-size:12px;color:var(--maroon);cursor:pointer;margin-bottom:10px;display:inline-block}
  .card.ph{background:var(--soft);border-style:dashed}
  .phline{height:11px;background:var(--soft);border-radius:6px}
  .phbox{height:96px;background:var(--soft);border-radius:8px}
  .phbtn{height:34px;width:150px;background:var(--soft);border-radius:8px}
  .wcard{background:var(--surface);border:1px solid var(--bd);border-radius:8px;padding:9px 10px;margin-bottom:7px;cursor:pointer;transition:border-color .12s}
  .wcard:hover{border-color:var(--maroon)}
  .calnav{width:32px;height:32px;border:1px solid var(--bd2);background:var(--surface);border-radius:8px;cursor:pointer;font-size:15px;color:var(--mut);line-height:1}
  .calnav:hover{border-color:var(--maroon);color:var(--maroon)}
  .cal{background:var(--surface);border:1px solid var(--bd2);border-radius:12px;padding:14px}
  .calhd{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:7px}
  .calhd div{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#b6bcc4;text-align:center}
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .cell{min-height:60px;border:1px solid var(--bd);border-radius:9px;padding:5px 7px;cursor:pointer;background:var(--surface);transition:border-color .12s,background .12s}
  .cell:hover{border-color:var(--bd2)}
  .cell.empty{background:transparent;border-color:transparent;cursor:default}
  .cell.on{border-color:var(--maroon);background:var(--soft)}
  .cell .dn{font-size:11.5px;color:var(--mut);font-weight:600}
  .cell.today .dn{color:var(--maroon);font-weight:800}
  .cdots{display:flex;gap:3px;flex-wrap:wrap;margin-top:6px}
  .cdot{width:6px;height:6px;border-radius:999px;background:#9aa6b2}.cdot.aged{background:#f59e0b}.cdot.rem{background:var(--maroon)}
  .cmore{font-size:9px;color:var(--mut2);margin-top:2px}
  .calside{background:var(--surface);border:1px solid var(--bd2);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;max-height:520px}
  .csh{padding:12px 15px;border-bottom:1px solid var(--bd);background:var(--soft)}
  .csh .dt{font-size:14px;font-weight:800;color:var(--ink)}
  .csh .ct{font-size:11px;color:var(--mut2);margin-top:1px}
  .csb{padding:11px 12px;overflow:auto;flex:1}
  .cirow{border:1px solid var(--bd);border-radius:9px;padding:9px 11px;margin-bottom:7px;cursor:pointer;transition:border-color .12s}
  .cirow:hover{border-color:var(--maroon)}
  .cirow .s{font-size:12.5px;font-weight:600;color:var(--ink);line-height:1.35}
  .cirow .m{font-size:10.5px;color:var(--mut2);margin-top:4px;display:flex;justify-content:space-between;gap:6px;align-items:center}
  .phone{max-width:360px;margin:0 auto;border:11px solid #2f2a26;border-radius:32px;background:var(--soft);padding:16px 14px 20px;box-shadow:0 18px 44px rgba(0,0,0,.2)}
  .pnotch{width:110px;height:5px;border-radius:999px;background:#2f2a26;margin:-6px auto 12px}
  .mpill{font-size:10.5px;border:1px solid var(--bd2);background:var(--surface);border-radius:999px;padding:4px 10px;cursor:pointer;color:var(--txt)}
  .mcard{background:var(--surface);border:1px solid var(--bd);border-radius:10px;padding:10px 11px;margin-bottom:8px;cursor:pointer}
  .mcard.on{border-color:var(--maroon);background:var(--soft)}
  .mchk{width:18px;height:18px;border-radius:6px;border:1.5px solid #d1d5db;display:inline-flex;align-items:center;justify-content:center;font-size:12px;color:var(--onaccent);flex-shrink:0}
  .mchk.on{background:var(--maroon);border-color:var(--maroon)}
  .dtabs{display:flex;gap:4px;border-bottom:1px solid var(--bd);margin-bottom:12px}
  .dtab{font-size:12.5px;border:0;background:none;padding:8px 12px;color:var(--mut);cursor:pointer;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
  .dtab:hover{color:var(--txt)}.dtab.on{color:var(--maroon);border-color:var(--maroon);font-weight:700}
  .dtab .n{font-size:10px;color:var(--mut2)}.dtab.on .n{color:var(--maroon)}
  .ndwrap{position:relative}
  .ndmenu{display:none;position:absolute;right:0;top:40px;background:var(--surface);border:1px solid var(--bd2);border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.14);min-width:230px;z-index:40;overflow:hidden}
  .ndmenu.on{display:block}
  .ndi{padding:11px 14px;cursor:pointer;border-bottom:1px solid #f2f2f2}
  .ndi:last-child{border-bottom:0}.ndi:hover{background:var(--pink)}
  .ndi b{display:block;font-size:12.5px;color:var(--ink)}.ndi span{font-size:10.5px;color:var(--mut2)}
  .dlist{background:var(--surface);border:1px solid var(--bd2);border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .dlhead{display:flex;align-items:center;gap:10px;padding:9px 14px;background:var(--soft);border-bottom:1px solid var(--bd)}
  .dbulkinline{display:flex;gap:8px}
  .drow{display:grid;grid-template-columns:28px 34px 108px 150px 88px 112px 1fr 116px 112px;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--bd);cursor:pointer;position:relative;background:var(--surface);font-size:11.5px}
  .dhead{display:grid;grid-template-columns:28px 34px 108px 150px 88px 112px 1fr 116px 112px;gap:8px;padding:8px 12px;background:var(--soft);border-bottom:1.5px solid var(--bd2);font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);font-weight:800}
  .dsno{font-size:10.5px;color:var(--mut2);text-align:right;padding-right:2px;font-variant-numeric:tabular-nums}
  .dbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:0 0 8px;margin-bottom:11px;border-bottom:1px solid var(--bd)}
  .dbarm{font-size:11px;color:var(--mut);flex:1;min-width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dbara{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .dbarsep{width:1px;height:17px;background:var(--bd2);margin:0 2px}
  .dbara .dia{width:27px;height:27px;border-color:var(--maroon);color:var(--maroon)}
  .dbara .dia:hover{background:var(--pink)}
  .dbara .dia.on{background:var(--pink)}
  .dbara .dia svg{width:13.5px;height:13.5px}
  .dbarn{font-size:11px;color:var(--mut);background:var(--soft);border:1px solid var(--bd2);border-radius:8px;padding:8px 11px;margin:-4px 0 12px}
  .btn.bsm{padding:5px 12px;font-size:11.5px;border-radius:7px}
  .cmp{background:var(--soft);border:1px solid var(--bd2);border-radius:10px;padding:13px 14px;margin:-4px 0 13px}
  .cmpg{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .ccchip{font-size:11px;padding:5px 11px;border-radius:999px;border:1px solid var(--bd2);background:var(--surface);color:var(--mut);cursor:pointer;user-select:none}
  .ccchip:hover{border-color:var(--maroon);color:var(--maroon)}
  .ccchip.on{background:var(--pink);border-color:var(--maroon);color:var(--maroon);font-weight:700}
  .thleg{display:flex;gap:14px;flex-wrap:wrap;padding-bottom:10px;margin-bottom:11px;border-bottom:1px solid var(--bd)}
  .thp{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;color:var(--mut);font-weight:600}
  .thav{width:23px;height:23px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;letter-spacing:.3px;flex-shrink:0;color:#fff}
  .thav.p0{background:#8B0000}.thav.p1{background:#4b6785}.thav.p2{background:#7a6136}.thav.p3{background:#5b6b52}
  .thcc{font-size:11px;color:var(--mut);background:var(--soft);border:1px solid var(--bd2);border-radius:7px;padding:7px 10px;margin-bottom:12px}
  .thread{display:flex;flex-direction:column;gap:9px}
  .msg2{display:flex;gap:9px;align-items:flex-start;max-width:82%}
  .msg2.mine{flex-direction:row-reverse;align-self:flex-end;text-align:right}
  .msg2.cont{margin-top:-5px}
  .msgb{background:var(--soft);border:1px solid var(--bd);border-radius:11px;padding:8px 12px;min-width:0}
  .msg2.mine .msgb{background:var(--pink);border-color:var(--pink)}
  .msgh{font-size:10px;color:var(--mut);margin-bottom:4px;display:flex;gap:7px;flex-wrap:wrap;align-items:baseline}
  .msg2.mine .msgh{justify-content:flex-end}
  .msgh b{color:var(--ink);font-size:11px}
  .msgr{color:var(--mut2)}
  .msgto{color:var(--maroon);font-weight:600}
  .msgd{color:var(--mut2)}
  .msgt{font-size:12px;color:var(--ink);line-height:1.6;white-space:pre-wrap}
  .msgk{display:block;font-size:9.5px;color:var(--mut2);margin-top:5px;text-transform:uppercase;letter-spacing:.4px}
  .dcol{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--txt)}
  .dcol.mono{font-family:ui-monospace,Menlo,monospace;font-size:10px;color:var(--mut)}
  .drow.read{background:var(--soft)}
  .drow:last-of-type{border-bottom:0}
  .drow:hover{background:var(--surface);box-shadow:inset 3px 0 0 var(--maroon), 0 1px 8px rgba(0,0,0,.07);z-index:2}
  .drow.exp{background:var(--surface);box-shadow:inset 3px 0 0 var(--maroon)}
  .drow.sel{background:var(--soft)}
  .drow.unread{background:var(--surface)}.drow.unread .dsubj,.drow.unread .dfrm{font-weight:700;color:var(--ink)}
  .drow.unread::after{content:"";position:absolute;left:4px;top:50%;transform:translateY(-50%);width:5px;height:5px;border-radius:999px;background:var(--maroon)}
  .dchk{width:17px;height:17px;border-radius:5px;border:1.5px solid #cbd5e1;display:inline-flex;align-items:center;justify-content:center;font-size:11px;color:var(--onaccent);flex-shrink:0;background:var(--surface)}
  .dchk.on{background:var(--maroon);border-color:var(--maroon)}
  .dfrm{font-size:12px;color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dsubj{font-size:12.5px;color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dtag{font-size:9.5px;color:#8a7f7f;background:#f3ecec;border-radius:4px;padding:1px 6px;margin-left:6px}
  .stag{font-size:8.5px;font-weight:700;border-radius:4px;padding:1px 6px;margin-left:4px;letter-spacing:.3px;vertical-align:middle}
  .stag.raised{background:var(--pink);color:var(--maroon)}
  .stag.fwd{background:#eaf0f6;color:#4b6785}
  .dend{display:flex;align-items:center;justify-content:flex-end;gap:7px;position:relative;min-height:26px}
  .ddate{font-size:11px;color:var(--mut2)}
  .dsnz{font-size:10px;color:#b45309;background:#fffbeb;border:1px solid #fde68a;border-radius:5px;padding:1px 6px}
  .dacts{display:none;gap:4px}.drow:hover .dacts{display:flex}.drow:hover .ddate{display:none}
  .dcaret{color:#c9c3c3;display:inline-flex;transition:transform .15s}.dcaret.up{transform:rotate(180deg)}
  .dcaret svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .dia{width:26px;height:26px;border-radius:6px;border:1px solid var(--bd2);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;color:var(--mut);cursor:pointer}
  .dia:hover{border-color:var(--maroon);color:var(--maroon)}.dia.ok:hover{border-color:#16a34a;color:#16a34a}
  .dia.on{border-color:var(--maroon);color:var(--maroon);background:var(--soft)}
  .dia svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .drow.exp{background:var(--soft);border-bottom:0;box-shadow:inset 3px 0 0 var(--maroon)}
  .drow.exp .dsubj,.drow.exp .dfrm{font-weight:700;color:var(--ink)}
  .dexp{background:var(--surface);border:1px solid var(--bd2);border-top:0;margin:0 10px 12px;border-radius:0 0 11px 11px;box-shadow:0 8px 22px rgba(139,0,0,.09);overflow:hidden}
  .dexph{display:flex;justify-content:space-between;align-items:center;background:var(--soft);padding:9px 15px;border-bottom:1px solid var(--bd);font-size:12px;font-weight:700;color:var(--maroon)}

/* ===================== Dak numbering — Annexure E =====================
   MARKER - YYMMDD - NNNN          e.g.  L-260823-0147 , C-260823-0147 , F52-260823-0147
   · MARKER  a dak takes L (correspondence) or C (circular), from its topic
   ·          a form takes F + its form number, and keeps it on binding
   · YYMMDD  the date the item was raised — reads almost as before, and sorts correctly
   · NNNN    the running number, unique across India FOR THAT DATE — not counted per office.
             This is what lets any office quote a number and every other office find the item.
   Issued once, at submission. Never re-issued, never changed. Never displayed alone —
   the place, area and subject accompany it wherever it appears.                        */
function areaCodeOf(off){ var k=off, g=0; while(k && OFF[k] && g++<8){ if(OFF[k].level==='area') return k; k=OFF[k].parent; } return off||'SCI'; }
/* A dak's marker says which kind of dak it is, and comes from its topic.
   A form's marker says which form it is. The two never overlap: L or C is a
   dak, F is a form, so no reference is ambiguous about what it identifies. */
function dakMarker(t){ return (t && t.circular) ? 'C' : 'L'; }
function markerFor(o){ o=o||{};
  if(o.circular) return 'C';
  if(o.gen) return 'L';
  var f=o.form||''; var m=f.match(/(\d+)/);
  return m? 'F'+m[1] : 'L'; }
function ymd6(dt){ dt=dt||new Date(); var y=String(dt.getFullYear()).slice(2), m=dt.getMonth()+1, d=dt.getDate();
  return y+(m<10?'0':'')+m+(d<10?'0':'')+d; }
var NUMSEQ={};
function pad4(n){ n=String(n); while(n.length<4) n='0'+n; return n; }
function issueNo(marker, off, dt){            /* off is not part of the number — the record carries the origin */
  var key=ymd6(dt); NUMSEQ[key]=(NUMSEQ[key]||0)+1;
  return marker+'-'+key+'-'+pad4(NUMSEQ[key]); }
/* seeding only — lets the demo data carry believable, already-used serials */
function issueNoAt(marker, off, dt, serial){
  var key=ymd6(dt);
  if(serial!=null){ NUMSEQ[key]=Math.max(NUMSEQ[key]||0, serial); return marker+'-'+key+'-'+pad4(serial); }
  return issueNo(marker, off, dt); }

function mkItem(pfx, dt, subj, o){ o=o||{};

    trail:[{w:'Raised at the '+LEVELNAME[raiser], p:o.by||'Office of the '+LEVELNAME[raiser], t:d(o.age==null?3:o.age)}] };
  if(o.closed){ it.closed=true; it.badge=o.badge||'bg'; it.status=o.status||('Approved · decision with the '+LEVELNAME[raiser]);
    it.trail.push({w:'Approved by the '+LEVELNAME[chain[chain.length-1]], p:'', t:d(1)}); }
  else if(o.gen){ it.chain=[raiser,o.to||'area']; it.step=1; it.to=o.to||'area'; it.badge=o.badge||'ba'; it.status=o.status||('With '+LEVELNAME[it.to]);

  else if(o.paper){ it.chain=[raiser]; it.step=0; it.badge='bb'; it.status='Received — physical dak';
    it.trail.push({w:'Pending — marking within the office',t:null,pending:true}); }
  else { var t=step===chain.length-1; it.badge=o.badge||'ba';
    it.status=o.status||('With '+LEVELNAME[chain[step]]+(t?(mode==='info'?' · for information':' · to approve'):' · recommending'));

  it.fwdBy=(it.chain||[]).slice(1, it.step).filter(function(l){return l!==it.raiser;});
  if(!it.gen && !it.paper){
    var rOff=o.raiserOff||LVLOFF[raiser]||'LDH1';
    it.raiserOff=rOff; it.offChain=officeChain(rOff, term);

  var allowed=DESIG_BY_TYPE[d.type]||['S','P','M'];
  var cols='<tr><th style="width:26px">Sr</th><th>Name</th><th>Desig. held</th><th>Father’s Name</th><th>Sewa yrs</th><th>Qualification</th><th>DOB</th><th>Age</th><th>D.O.I.</th><th>Profession</th><th style="width:150px">Retirement / Relieved / Extension <span style="font-weight:400;text-transform:none">(reasons in brief)</span></th><th style="width:120px">Sewa now recommended</th></tr>';
  var rowsA=(d.exist||[]).map(function(e,ix){ var leaf=LEAVES.indexOf(e.outcome)>=0;
    var oc= editable? '<select class="inp" onchange="f52out('+ix+',this.value)">'+OUTCOMES.map(function(o){return '<option'+(o===e.outcome?' selected':'')+'>'+o+'</option>';}).join('')+'</select>'+(e.outcome!=='Continue as is'?'<input class="inp" style="margin-top:4px" placeholder="Reason" value="'+esc(e.note||'')+'" oninput="f52note('+ix+',this.value)">':'') : esc(e.outcome||'')+(e.note?' <span style="color:var(--mut2)">('+esc(e.note)+')</span>':'');
    var rc= leaf? '<span style="color:var(--mut2)">—</span>' : (editable? '<select class="inp" onchange="f52rec('+ix+',this.value)">'+allowed.map(function(dg){return '<option value="'+dg+'"'+(e.rec===dg?' selected':'')+'>'+dg+'</option>';}).join('')+'</select>' : (e.rec||'—'));
    return '<tr><td>'+(ix+1)+'</td><td><b>'+esc(e.name)+'</b></td><td>'+esc(e.desig||'')+'</td><td>'+esc(e.father||'')+'</td><td>'+esc(e.yrs||'')+'</td><td>'+esc(e.qual||'')+'</td><td>'+esc(e.dob||'')+'</td><td>'+ageDob(e.dob)+'</td><td>'+esc(e.doi||'')+'</td><td>'+esc(e.prof||'')+'</td><td>'+oc+'</td><td>'+rc+'</td></tr>'; }).join('');
  var onRecord=bio02List();
  var rowsB=(d.adds||[]).map(function(a,ix){ var b=a.bio||{}, done=b._done;
    var nm = editable? '<input class="inp" value="'+esc(a.name||'')+'" oninput="f52aset('+ix+',\'name\',this.value)" placeholder="person proposed">' : esc(a.name||'—');
    var dg = editable? '<select class="inp" onchange="f52aset('+ix+',\'desig\',this.value)">'+[''].concat(allowed).map(function(x){return '<option value="'+x+'"'+(a.desig===x?' selected':'')+'>'+(x||'—')+'</option>';}).join('')+'</select>' : (a.desig||'—');
    var bio;
    if(editable){
      var pick = onRecord.length? '<select class="inp" style="min-width:190px" onchange="attachBio('+ix+',this.value)">'+
          '<option value="">Attach an SCI-02 already on record…</option>'+
          onRecord.map(function(f){return '<option value="'+f.id+'"'+(b._from===f.id?' selected':'')+'>'+esc(f.data.name||f.id)+' &middot; '+f.id+'</option>';}).join('')+
        '</select>' : '<span style="font-size:10px;color:var(--mut2)">No SCI-02 on record for this place yet.</span>';
      var state = done? '<span class="badge bg" style="font-size:9px">SCI-02 attached'+(b._from?' &middot; '+esc(b._from):' &middot; keyed here')+'</span>' : '<span style="font-size:10px;color:var(--mut2)">bio-data not attached</span>';
      bio = '<div style="display:flex;flex-direction:column;gap:5px;align-items:flex-start">'+pick+
        '<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">'+state+
        '<button class="btn '+(done?'btns':'btnp')+'" style="padding:3px 8px;font-size:10.5px" onclick="openBio('+ix+')">'+(done?'View / edit':'Key a new SCI-02')+'</button>'+
        '<span style="cursor:pointer;color:var(--maroon)" title="Remove this addition" onclick="f52adel('+ix+')">&times;</span></div></div>';
    } else bio = done? '<span class="badge bg" style="font-size:9px">SCI-02 attached'+(b._from?' &middot; '+esc(b._from):'')+'</span>' : '<span style="color:var(--mut2)">not filled</span>';
    return '<tr><td>'+(ix+1)+'</td><td>'+nm+'</td><td>'+dg+'</td><td>'+esc(b.father||'')+'</td><td></td><td>'+esc(b.qual||'')+'</td><td>'+esc(b.dob||'')+'</td><td>'+ageDob(b.dob)+'</td><td>'+esc(b.doi||'')+'</td><td>'+esc(b.prof||'')+'</td><td colspan="2">'+bio+'</td></tr>'; }).join('')||'<tr><td colspan="12" style="color:var(--mut2)">No additions proposed.</td></tr>';
  return fOfficialHead(d,editable)+
    '<div style="font-size:11.5px;color:var(--txt);margin:14px 0 4px">Dear Brother,</div>'+
    '<div style="font-size:11.5px;color:var(--txt);margin-bottom:10px">Recommendation for constitution / re-constitution of committee in respect of the above Satsang Place, with details as under, is forwarded:</div>'+
    '<div style="overflow-x:auto"><table class="reg" style="font-size:10.5px;min-width:900px">'+cols+
      '<tr><td colspan="12" style="background:var(--soft);font-weight:800;color:var(--maroon);font-size:10px">A &nbsp; EXISTING COMMITTEE</td></tr>'+rowsA+
      '<tr><td colspan="12" style="background:var(--soft);font-weight:800;color:var(--maroon);font-size:10px">B &nbsp; ADDITIONS PROPOSED <span style="font-weight:400;color:var(--mut)">(Bio Data attached in Form SCI-02)</span>'+(editable?' <button class="btn btns" style="padding:2px 8px;font-size:10px;margin-left:8px" onclick="f52add()">+ Add</button>':'')+'</td></tr>'+rowsB+
    '</table></div>'+
    '<div style="font-size:11.5px;color:var(--txt);margin-top:12px">2. Approval for constitution / re-constitution of committee as proposed above may please be accorded.</div>'+
    fSign('Secretary')+
    '<div style="font-size:10px;color:var(--mut2);margin-top:8px">Use designation as S, P, M, CT, ACT, I, AI.</div>';
}

/* ---- SCI-15 · Offer of Items / Material in Donation ---- */
function f15init(d){ initPlace(d); if(d._i15) return; d._i15=true;
  if(!d.rows) d.rows=[{article:'',offer:'',cost:'',nature:'Capital',just:'',exQty:'',exDate:'',donorName:'',donorAddr:''}];
  d.rows.forEach(function(r){ if(!r.nature) r.nature='Capital'; }); }
function f15set(ix,k,v){ FCUR.rows[ix][k]=v; refreshA4();
  if(k==='cost'||k==='nature'){
    var tt=document.getElementById('f15-total'); if(tt) tt.innerHTML=rupee(f15total(FCUR));
    var sp=document.getElementById('f15-split'); if(sp) sp.innerHTML=splitLine(FCUR);
    var tm=document.getElementById('f15-term'); if(tm) tm.innerHTML=termLine(FCUR);
    if(!FE) refreshFlow(); } }
function f15add(){ FCUR.rows.push({article:'',offer:'',cost:'',nature:'Capital',just:'',exQty:'',exDate:'',donorName:'',donorAddr:''}); rerenderForm(); }
function f15del(ix){ FCUR.rows.splice(ix,1); if(!FCUR.rows.length) f15add(); else rerenderForm(); }
function f15total(d){ return (d.rows||[]).reduce(function(s,r){ return s+(+r.cost||0); },0); }
function splitLine(d){ var t=natureTotals(d); if(!t.Capital&&!t.Revenue) return '';
  var p=[]; if(t.Capital) p.push('capital '+rupee(t.Capital)); if(t.Revenue) p.push('revenue '+rupee(t.Revenue));
  return '('+p.join(' &middot; ')+')'; }
function termLine(d){ var t=natureTotals(d); if(!t.Capital&&!t.Revenue) return '';
  return '<b style="color:var(--maroon)">On these values the offer is decided by the '+terminalLabel2(terminalForValue('SCI-15',t))+'.</b>'; }
function form15(d,editable){ f15init(d);
  var head='<tr><th style="width:26px">Sr</th><th>Name of Article</th><th style="width:70px">Present Offer</th><th style="width:90px">Cost of item</th><th style="width:96px">Nature</th><th>Justification / purpose</th><th style="width:70px">Existing qty</th><th style="width:90px">Date of acquisition</th><th>Donor’s name <span style="font-weight:400;text-transform:none">(initiated)</span></th><th>Donor’s address</th>'+(editable?'<th style="width:24px"></th>':'')+'</tr>';
  var rows=(d.rows||[]).map(function(r,ix){
    function c(k,ph){ return editable? '<input class="inp" value="'+esc(r[k]||'')+'" oninput="f15set('+ix+',\''+k+'\',this.value)"'+(ph?' placeholder="'+ph+'"':'')+'>' : esc(r[k]||'—'); }
    var nat = editable? '<select class="inp" onchange="f15set('+ix+',\'nature\',this.value)">'+NATURES.map(function(n){return '<option'+((r.nature||'Capital')===n?' selected':'')+'>'+n+'</option>';}).join('')+'</select>' : (r.nature||'Capital');
    return '<tr><td>'+(ix+1)+'</td><td>'+c('article','item offered')+'</td><td>'+c('offer','qty')+'</td><td>'+c('cost','₹')+'</td><td>'+nat+'</td><td>'+c('just')+'</td><td>'+c('exQty')+'</td><td>'+c('exDate')+'</td><td>'+c('donorName')+'</td><td>'+c('donorAddr')+'</td>'+(editable?'<td style="text-align:right"><span style="cursor:pointer;color:var(--maroon)" onclick="f15del('+ix+')">&times;</span></td>':'')+'</tr>'; }).join('');
  var cash = editable? '<select class="inp" style="max-width:120px" onchange="fset(\'cashSewa\',this.value)"><option value="No"'+(d.cashSewa==='No'?' selected':'')+'>No</option><option value="Yes"'+(d.cashSewa==='Yes'?' selected':'')+'>Yes</option></select>' : (d.cashSewa||'No');
  return fOfficialHead(d,editable)+
    '<div class="fgrid" style="grid-template-columns:1fr 3fr;gap:12px;margin-top:10px">'+(editable?fld('Average weekly attendance','attendance','',d):fldRO('Average weekly attendance',esc(d.attendance||'—')))+'<div></div></div>'+
    '<div style="font-size:11.5px;color:var(--txt);margin:14px 0 4px">Dear Brother,</div>'+
    '<div style="font-size:11.5px;color:var(--txt);margin-bottom:10px">An offer of the following items is being sent, for which approval may please be accorded.</div>'+
    '<div style="overflow-x:auto"><table class="reg" style="font-size:10.5px;min-width:900px">'+head+rows+'</table></div>'+
    (editable?'<div style="margin-top:8px"><button class="btn btns" style="padding:3px 10px;font-size:11px" onclick="f15add()">+ Add an item</button></div>':'')+
    '<div style="margin-top:12px;display:flex;gap:26px;align-items:center;flex-wrap:wrap">'+
      '<div style="font-size:11.5px;color:var(--ink)">Total value offered: <b id="f15-total">'+rupee(f15total(d))+'</b> <span id="f15-split" style="color:var(--mut);font-weight:400">'+splitLine(d)+'</span></div>'+
      '<div style="font-size:11px;color:var(--mut)">Offer against acceptance of cash sewa: '+cash+'</div></div>'+
    '<div style="margin-top:9px;font-size:10.5px;color:var(--mut);background:var(--soft);border:1px solid var(--bd2);border-radius:7px;padding:8px 11px;line-height:1.6"><b>Approval limits</b> &mdash; '+limitsNote()+' Where an offer carries both natures, the higher requirement governs. <span id="f15-term">'+termLine(d)+'</span></div>'+
    '<div style="font-size:10.5px;color:var(--mut2);margin-top:10px;line-height:1.6">The sewa material offered is as per Beas design and will be used as per Beas drawings. No collection whatsoever is to be made at any Satsang Place. To be taken in the Asset Register / Accounts.</div>'+
    fSign('Incharge / CT / Secretary');
}

/* ---- SCI-02 · Bio Data for Appointment of Functionaries ---- */
function f02init(d){ initPlace(d); if(d._i02) return; d._i02=true; if(!d.children) d.children=[{name:'',age:'',married:''}]; }
function f02cset(ix,k,v){ FCUR.children[ix][k]=v; refreshA4(); }
function f02cadd(){ FCUR.children.push({name:'',age:'',married:''}); rerenderForm(); }
function f02cdel(ix){ FCUR.children.splice(ix,1); rerenderForm(); }
function form02(d,editable){ f02init(d);
  function F(lbl,k,ph){ return editable? fld(lbl,k,ph||'',d) : fldRO(lbl,esc(d[k]||'—')); }
  function YN(lbl,k){ return editable? '<div><label class="lbl">'+lbl+'</label><select class="inp" onchange="fset(\''+k+'\',this.value)"><option value="No"'+(d[k]==='No'?' selected':'')+'>No</option><option value="Yes"'+(d[k]==='Yes'?' selected':'')+'>Yes</option></select></div>' : fldRO(lbl,esc(d[k]||'No')); }
  var ch=(d.children||[]).map(function(c,ix){
    function cc(k,ph){ return editable? '<input class="inp" value="'+esc(c[k]||'')+'" oninput="f02cset('+ix+',\''+k+'\',this.value)"'+(ph?' placeholder="'+ph+'"':'')+'>' : esc(c[k]||'—'); }
    return '<tr><td>'+String.fromCharCode(97+ix)+')</td><td>'+cc('name')+'</td><td>'+cc('age')+'</td><td>'+cc('married','married / settled')+'</td>'+(editable?'<td style="text-align:right"><span style="cursor:pointer;color:var(--maroon)" onclick="f02cdel('+ix+')">&times;</span></td>':'')+'</tr>'; }).join('');
  return fOfficialHead(d,editable)+
    '<div class="fp-sec">Particulars of the person proposed</div>'+
    '<div class="fgrid" style="grid-template-columns:80px 1fr 1fr;gap:12px">'+
      (editable?'<div><label class="lbl">Title</label><select class="inp" onchange="fset(\'title\',this.value)">'+['Mr.','Mrs.','Ms.'].map(function(t){return '<option'+(d.title===t?' selected':'')+'>'+t+'</option>';}).join('')+'</select></div>':fldRO('Title',esc(d.title||'—')))+
      F('First name','name')+F('Last name','last')+'</div>'+
    '<div class="fgrid" style="grid-template-columns:1fr 1fr 2fr;gap:12px;margin-top:9px">'+F('2. Date of birth','dob','dd/mm/yyyy')+fldRO('Age',ageDob(d.dob)||'—')+F('3. Father’s / husband’s name','father')+'</div>'+
    '<div style="margin-top:9px">'+F('4. Address','address')+'</div>'+
    '<div class="fgrid" style="grid-template-columns:1fr 1fr 2fr;gap:12px;margin-top:9px">'+F('PIN','pin')+F('Telephone No.','phone')+'<div></div></div>'+
    '<div class="fgrid" style="grid-template-columns:1fr 1fr;gap:12px;margin-top:9px">'+F('5. Date of initiation (Naam Daan)','doi','dd/mm/yyyy')+F('Place of initiation','poi')+'</div>'+
    '<div class="fgrid" style="grid-template-columns:1fr 1fr;gap:12px;margin-top:9px">'+F('6. Educational qualifications','qual')+F('7. Profession / occupation','prof','give details of service')+'</div>'+
    '<div class="fgrid" style="grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:9px">'+F('8. Annual income','income')+F('9. Time available for sewa daily','sewaTime')+F('10. Conveyance held','conveyance')+'</div>'+
    '<div class="fp-sec">Sewa</div>'+
    '<div class="fgrid" style="grid-template-columns:1fr 1.2fr 1fr 1fr;gap:12px">'+YN('11. Doing sewa in Beas?','beasSewa')+F('Department','beasDept')+F('From','beasFrom')+F('To','beasTo')+'</div>'+
    '<div class="fgrid" style="grid-template-columns:1fr 2fr 1fr;gap:12px;margin-top:9px">'+YN('12. Doing sewa at Centre?','centreSewa')+F('Kind of sewa','centreKind')+F('Since when','centreSince')+'</div>'+
    '<div class="fp-sec">13 · Details of children'+(editable?' <button class="btn btns" style="padding:2px 8px;font-size:10px;margin-left:8px" onclick="f02cadd()">+ Add</button>':'')+'</div>'+
    '<table class="reg" style="font-size:10.5px"><tr><th style="width:28px">#</th><th>Name</th><th style="width:70px">Age</th><th>Married / settled</th>'+(editable?'<th style="width:24px"></th>':'')+'</tr>'+ch+'</table>'+
    '<div style="margin-top:10px">'+F('14. Any other details','other')+'</div>'+
    '<div style="margin-top:16px;padding-top:10px;border-top:1px solid var(--bd);display:flex;justify-content:space-between;font-size:10.5px;color:var(--mut)"><span>_____________________<br>Signature of applicant</span><span style="text-align:right">_____________________<br>Countersigned by Area Secretary</span></div>';
}
function formBody(code,d){ d=d||{};
  if(code==='SCI-52') return form52(d,true);
  if(code==='SCI-02') return form02(d,true);
  if(code==='SCI-15') return form15(d,true);
  if(code==='SCI-56') return '<div style="font-size:11px;color:var(--mut);background:var(--soft);border:1px dashed var(--bd2);border-radius:8px;padding:9px 11px;margin-bottom:12px">The official SCI-56 stationery is not with us yet — the fields below are indicative. SCI-15, SCI-52 and SCI-02 are built to their printed formats.</div>'+
    '<div class="fp-sec" style="border-top:0;margin-top:0">Particulars of the Satsang Karta proposed</div>'+
    '<div class="fgrid" style="grid-template-columns:1fr 1fr">'+fld('Name','name','',d)+fld('Father’s name','father','',d)+'</div>'+
    '<div class="fgrid" style="grid-template-columns:1fr 1fr;margin-top:8px">'+fld('Date of birth','dob','dd/mm/yyyy',d)+fld('Date of initiation','init','dd/mm/yyyy',d)+'</div>'+
    '<div class="fgrid" style="grid-template-columns:1fr 1fr;margin-top:8px">'+fld('Qualification','qual','',d)+fld('Profession','prof','',d)+'</div>'+
    '<div class="fgrid" style="grid-template-columns:2fr 1fr;margin-top:8px">'+fld('Satsang place','place','',d)+fld('Recommended for','recFor','e.g. Satsang Karta',d)+'</div>';
  return '<div style="font-size:11.5px;color:var(--mut);margin-bottom:10px">A general enclosure — the exact fields for '+code+' are settled later.</div>'+
    fld('Title','title','',d)+'<div style="margin-top:8px">'+fld('Particulars','particulars','',d)+'</div><div style="margin-top:8px">'+fld('Remarks','remarks','',d)+'</div>';
}
function enclKV(e){ var d=e.data||{};
  if(e.code==='SCI-15'){ if(d.rows&&d.rows.length){ var fr=d.rows.filter(function(r){return r.article;}); var lead=fr[0]||{};
      var nt=natureTotals(d);
      return kvr('Items offered',fr.length?(esc(lead.article)+(fr.length>1?' + '+(fr.length-1)+' more':'')):'—')+kvr('Present offer',lead.offer||'—')+
        kvr('Capital nature',nt.Capital?rupee(nt.Capital):'—')+kvr('Revenue nature',nt.Revenue?rupee(nt.Revenue):'—')+
        kvr('Total value',rupee(rowsCost(d)))+kvr('Justification',lead.just||'—'); }
    return kvr('Article / item',d.item||'—')+kvr('Quantity',d.qty||'—')+kvr('Cost',rupee(+d.cost||0))+kvr('Justification',d.just||'—'); }
  if(e.code==='SCI-52'){ var ch=(d.exist||[]).filter(function(x){return x.outcome&&x.outcome!=='Continue as is';}).length, ad=(d.adds||[]).filter(function(x){return x.name;}).length, bio=(d.adds||[]).filter(function(x){return x.bio&&x.bio._done;}).length; return kvr('Satsang place',d.place||'—')+kvr('Type',d.type||'—')+kvr('Changes proposed',ch+' member change'+(ch!==1?'s':''))+kvr('Additions',ad+(ad?' · '+bio+' with SCI-02':''))}
  if(e.code==='SCI-56') return kvr('Name',d.name||'—')+kvr('Father’s name',d.father||'—')+kvr('Place',d.place||'—')+kvr('Recommended for',d.recFor||'—');
  return Object.keys(d).filter(function(k){return k[0]!=='_';}).map(function(k){return kvr(k,d[k]||'—');}).join('');
}
function enclosureCards(it){
  if(it.enclosures&&it.enclosures.length) return it.enclosures.map(function(e){ var extra=(e.code==='SCI-15'&&it.chain&&it.chain.length)?kvr('Approving level (by nature &amp; value)',LEVELNAME[it.chain[it.chain.length-1]]):'';
      var rec=findForm(e.id||e.ref), refId=(rec&&rec.id)||e.id||'';
      var acts='<button class="btn btns" style="padding:4px 11px;font-size:11px" onclick="openFormPdf(\''+refId+'\')">Open form</button>';
      if(rec && rec.status!=='draft' && !rec.editUnlocked && canApprove() && myOffice()!==rec.ownerOff) acts+='<button class="btn btns" style="padding:4px 11px;font-size:11px;margin-left:7px" onclick="unlockFormEdit(\''+refId+'\')">Allow raiser to edit</button>';
      return '<div class="card" style="margin-top:14px"><h3>Enclosure — '+e.code+' <span class="badge bp" style="font-size:9px;cursor:pointer" onclick="openFormPdf(\''+refId+'\')">'+refId+' &#8599;</span>'+(rec?' <span class="badge '+formStatusBadge(rec.status)+'" style="font-size:9px">'+rec.status+(rec.editUnlocked?' · open':'')+'</span>':'')+'</h3><div class="kv">'+enclKV(e)+extra+'</div><div style="margin-top:10px">'+acts+'</div></div>'; }).join('');
  if(it.formData) return '<div class="card" style="margin-top:14px"><h3>Enclosure &mdash; '+(it.form||'SCI-15')+'</h3><div class="kv">'+enclKV({code:(it.form||'SCI-15'),data:it.formData})+'</div><div style="margin-top:10px"><button class="btn btns" style="padding:4px 11px;font-size:11px" onclick="openInlineForm(\''+it.id+'\')">Open form</button></div></div>';
  return '';
}
function paperPanel(){
  var other=(PICKDT==='__OTHER__');
  var t=other?null:TOPICS[topicIndex(PICKDT,PICKSUBJ)];
  if(!other && !t) return '';
  if(!DRAFT.paper) DRAFT.paper={sender:'',recvDate:fmt(new Date())+' '+new Date().getFullYear(),scan:false,scanName:'',note:'',freeDT:'',freeSubj:''};
  var P=DRAFT.paper;
  var title = other ? 'Physical dak — not in the topic list' : titleCase(t.subj);
  var route = other ? 'the office above, one level at a time' : chainLevels(USERS[me].level,effTerminal(t,0)).map(function(l){return LEVELNAME[l];}).join(' → ');
  return '<div class="card" style="margin-top:14px">'+
    '<h3>'+title+' <span class="badge bb">physical dak</span></h3>'+
    '<div style="font-size:11.5px;color:var(--mut);margin-bottom:12px">Paper received from outside is recorded with a mandatory scan. Where the matter is not in the topic list &mdash; a bank, a government office, or a person &mdash; record its own Document Type and subject.</div>'+
    (other? '<div style="display:grid;grid-template-columns:1fr 1.4fr;gap:12px;margin-bottom:12px">'+
       '<div><label class="lbl">Document Type</label><input class="inp" value="'+esc(P.freeDT)+'" oninput="setP(\'freeDT\',this.value)" placeholder="e.g. Bank &middot; Government &middot; Legal"></div>'+
       '<div><label class="lbl">Subject</label><input class="inp" value="'+esc(P.freeSubj)+'" oninput="setP(\'freeSubj\',this.value)" placeholder="what the dak is about"></div>'+

/* ===================== Approved records =====================================
   The moment a dak is decided, the system writes the outputs itself:
     · an Approval Letter, on the deciding office's paper
     · a duly approved copy of every SCI form enclosed on it
   Both are kept permanently and are open to every office on the dak's route.
   No new number is minted — an output belongs to the dak that produced it.    */
var APPROVED=[];                       /* {dakId, kind:'letter'|'form', code, at, by, byName, office, decision, reason} */

function approvedFor(dakId,kind,code){
  return APPROVED.filter(function(a){ return a.dakId===dakId && a.kind===kind && (!code||a.code===code); })[0]; }
function approvedOf(it){ return APPROVED.filter(function(a){ return a.dakId===it.id; }); }
function itemById(id){ return ITEMS.filter(function(x){return x.id===id;})[0]; }

/* called the instant a decision is taken — approved, not approved, or noted */
function issueApprovalOutputs(it, decision, reason){
  if(!it || approvedFor(it.id,'letter')) return;
  var now=new Date(), off=myOffice();
  backfillEndorsements(it, decision||'Approved', now);
  var rec={
    dakId:it.id, kind:'letter', code:'LETTER', at:now, by:me, byName:meU().n,
    office:off, decision:decision||'Approved', reason:reason||'' };
  APPROVED.push(rec);
  /* every SCI form enclosed on the dak gets an approved copy of its own */
  (it.enclosures||[]).forEach(function(e){
    APPROVED.push({dakId:it.id, kind:'form', code:e.code, formId:e.id, at:now, by:me, byName:meU().n,
                   office:off, decision:decision||'Approved', reason:reason||''});
    var fr=findForm(e.id); if(fr){ fr.approved=(decision!=='Not approved'); fr.approvedAt=now; fr.approvedBy=meU().n; fr.approvedOff=off; fr.decision=decision||'Approved'; }
  });
  if(it.formData && !(it.enclosures||[]).length && it.form){
    APPROVED.push({dakId:it.id, kind:'form', code:it.form, formId:null, at:now, by:me, byName:meU().n,
                   office:off, decision:decision||'Approved', reason:reason||''});
  }
  it.approvedAt=now; it.approvedBy=meU().n; it.approvedOff=off; it.decision=decision||'Approved';
  it.trail.push({w:'Approval Letter and approved forms generated',t:now,n:'Available to every office on this dak.'});
}

/* who may open them — every office the dak passed through, and the raiser */
function mayOpenApproved(it){ if(!it) return false;
  var oc=ocOf(it), mine=myOffice();
  return oc.indexOf(mine)>=0 || it.raiserOff===mine || isCopyTo(it,mine); }
function approvedVisible(){
  return APPROVED.filter(function(a){ var it=itemById(a.dakId); return it && mayOpenApproved(it) && canView(it); }); }

/* ---------- endorsements: the stamp each authority puts on the papers ----------
   Every office that handles the dak leaves one stamp — the Satsang Place that signed
   and submitted it, each office that recommended it onward, and the office that decided.
   The stamps are what make an approved form self-evidencing: it shows, on its face,
   who recommended and who approved, and on what date. No office mints a number of its
   own — every stamp quotes the dak's own reference.                                   */
var ENDORSE={};
var AUTHTITLE={place:'Secretary / Incharge',area:'Area Secretary',state:'State Secretary',
               zone:'Zonal Secretary',sci:'Sewadar I/C, Satsang Centres in India'};
function authTitle(off){ var o=OFF[off]||{}; return AUTHTITLE[o.level]||LEVELNAME[o.level]||''; }
function authOfOffice(off){ var k=Object.keys(USERS).filter(function(u){
    return USERS[u].office===off && USERS[u].kind==='auth'; })[0];
  return k? USERS[k].n : authTitle(off); }
function endList(it){ if(!ENDORSE[it.id]) ENDORSE[it.id]=[]; return ENDORSE[it.id]; }
function addEndorse(it, act, off, who, when){
  if(!it) return null; var l=endList(it); off=off||myOffice();
  for(var i=0;i<l.length;i++) if(l[i].off===off){ l[i].act=act; return l[i]; }
  var e={off:off, level:(OFF[off]||{}).level, by:who||meU().n, title:authTitle(off),
         at:when||new Date(), act:act, ref:it.id};
  l.push(e); return e; }
function endWhen(e){ return e&&e.at? (fmt(e.at)+' '+e.at.getFullYear()) : ''; }
/* in the order the dak actually travelled */
function endorsements(it){ if(!it) return []; var oc=ocOf(it), l=(ENDORSE[it.id]||[]).slice();
  l.sort(function(a,b){ var i=oc.indexOf(a.off), j=oc.indexOf(b.off);
    if(i<0) i=99; if(j<0) j=99; return (i-j) || (a.at-b.at); });
  return l; }
function endOfLevel(d,lvl){ var l=(d&&d._end)||[]; for(var i=0;i<l.length;i++) if(l[i].level===lvl) return l[i]; return null; }
function endOfOffice(it,off){ var l=endorsements(it); for(var i=0;i<l.length;i++) if(l[i].off===off) return l[i]; return null; }
/* an office that handed the dak on before the stamps were kept still shows on the papers —
   its date is read back from the dak's own trail rather than invented */
function trailTimeFor(it, off){ var nm=LEVELNAME[(OFF[off]||{}).level]||'';
  var hit=(it.trail||[]).filter(function(x){ return x.t && nm && (x.w||'').indexOf(nm)>=0 &&
      /Recommend|Approved|Forwarded|Submitted|Raised|Signed/i.test(x.w||''); })[0];
  return hit? hit.t : null; }
function backfillEndorsements(it, decision, now){
  var oc=ocOf(it), mine=myOffice(), last=oc.indexOf(mine); if(last<0) last=oc.length-1;
  for(var i=0;i<last;i++){ if(endOfOffice(it,oc[i])) continue;
    addEndorse(it, (i===0?'Submitted':'Recommended'), oc[i], authOfOffice(oc[i]),
               trailTimeFor(it,oc[i])||now||new Date()); }
  addEndorse(it, decision, mine, meU().n, now||new Date()); }

/* ---------- the stamp itself ---------- */
function stampBox(e, big){ if(!e) return '';
  var no=(e.act==='Not approved');
  return '<span class="stmp'+(no?' no':'')+(big?' big':'')+'">'+
    '<span class="sa">'+esc(e.act)+'</span>'+
    '<span class="so">'+esc((OFF[e.off]||{}).name||e.off)+'</span><br>'+
    '<span class="sn">'+esc(e.by||'')+'</span><br>'+
    '<span class="sd">'+esc(e.title||'')+' &middot; '+esc(endWhen(e))+'</span><br>'+
    '<span class="sd">'+scw('Ref.')+' '+esc(e.ref||'')+'</span>'+
  '</span>'; }
function stampBand(it){ var l=endorsements(it); if(!l.length) return '';
  return '<div class="stmpband">'+l.map(function(e){ return stampBox(e); }).join('')+'</div>'; }

/* ---------- the endorsement page that travels with an approved form ---------- */
function endorseSheet(it, code){
  var a=approvedFor(it.id,'form',code)||approvedFor(it.id,'letter'); if(!a) return '';
  var notApp=(a.decision==='Not approved'), l=endorsements(it);
  return '<div class="sheet-a4 port">'+
    '<table class="lay"><tr><td style="width:17mm">'+RSSB_LOGO+'</td>'+
      '<td class="ftitle">'+scw('Satsang Centres in India')+'<br>'+
        scw(notApp?'Endorsement \u2014 Not Approved':'Endorsement of Approval')+'</td>'+
      '<td class="fno" style="width:30mm">'+esc(code)+'</td></tr></table>'+
    '<table class="lay" style="margin-top:4mm"><tr>'+
      '<td>'+scw('Ref. No.:')+' <b>'+esc(it.id)+'</b></td>'+
      '<td style="text-align:right;width:46mm">'+scw('Date:')+' '+fv(fmt(a.at)+' '+a.at.getFullYear(),'w2')+'</td></tr></table>'+
    '<div style="margin-top:6mm;text-align:justify">'+
      'This endorsement belongs to the <b>'+esc(code)+'</b> filed with the dak cited above and is to be read with it. '+
      'It carries the stamp of every authority in the reporting line, in the order the dak travelled. '+
      (notApp? 'The proposal <b>has not been approved</b>.'
             : 'The form on the preceding page <b>stands duly approved</b>.')+'</div>'+
    (a.reason? '<div style="margin-top:3mm">'+scw('Reason recorded:')+' '+esc(a.reason)+'</div>':'')+
    '<div style="margin-top:7mm;font-weight:700;font-variant:small-caps;font-size:11pt">'+
      scw('Stamps of the authorities')+'</div>'+
    stampBand(it)+
    '<div class="rule" style="margin-top:6mm"></div>'+
    '<div style="margin-top:2mm;font-size:9.5pt">'+
      scw('Generated by the Dak Handling System when the decision was recorded. No separate number is issued \u2014 every stamp quotes the dak\u2019s own reference.')+'</div>'+
  '</div>'; }

/* ---------- what was actually approved, set out in the letter ----------------
   The letter is what goes to the Satsang Place and is handed to the committee; the
   SCI-52 itself stays on the office record. So the letter carries the particulars —
   who is appointed, who continues, who stands relieved, and how the committee now
   reads — rather than merely citing the form.                                     */
function enclData(it,code){ var e=(it.enclosures||[]).filter(function(x){return x.code===code;})[0];
  if(e&&e.data&&Object.keys(e.data).length>3) return e.data;
  var r=e? findForm(e.id):null; return (r&&r.data)||(e&&e.data)||null; }
function desigFull(c){ return DESIG[c]||c||''; }
function letterPara(n,txt){ return '<div style="margin-top:3.4mm;text-align:justify">'+n+'.&nbsp;&nbsp; '+txt+'</div>'; }
function letterTable(head,rows,width){
  return '<table class="g" style="margin-top:2mm;width:'+(width||'96%')+';table-layout:fixed"><tr>'+
    head.map(function(h){ return '<th'+(h[1]?' style="width:'+h[1]+'"':'')+'>'+h[0]+'</th>'; }).join('')+'</tr>'+
    rows.map(function(r){ return '<tr>'+r.map(function(c,i){
      return '<td'+(i===0?' class="c"':'')+'>'+c+'</td>'; }).join('')+'</tr>'; }).join('')+'</table>'; }

function sum52(it,d){
  var ex=(d.exist||[]), ad=(d.adds||[]), out='', n=1;
  var leaving=ex.filter(function(m){ return LEAVES.indexOf(m.outcome)>=0; });
  var staying=ex.filter(function(m){ return LEAVES.indexOf(m.outcome)<0; });
  var moved  =staying.filter(function(m){ return m.rec && m.desig && m.rec!==m.desig; });
  if(ad.length) out+=letterPara(++n,
    'The following '+(ad.length===1?'sewadar is':'sewadars are')+' <b>appointed to the committee</b>, '+
    'the bio-data of each having been furnished on Form SCI-02 and found in order:')+
    letterTable([['Sr.','9%'],['Name','30%'],['Father\u2019s / Husband\u2019s Name','26%'],['Sewa approved','20%'],['Bio-data','15%']],
      ad.map(function(m,i){ var b=m.bio||{}; return [String(i+1)+'.', esc(m.name||''), esc(b.father||''),
        esc(desigFull(m.desig)), 'SCI-02 enclosed']; }));
  if(staying.length) out+=letterPara(++n,
    'The following '+(staying.length===1?'sewadar continues':'sewadars continue')+' on the committee:')+
    letterTable([['Sr.','9%'],['Name','36%'],['Sewa held','25%'],['Sewa approved','30%']],
      staying.map(function(m,i){ return [String(i+1)+'.', esc(m.name||''), esc(desigFull(m.desig)),
        esc(desigFull(m.rec||m.desig))+((m.rec&&m.desig&&m.rec!==m.desig)?' &mdash; change of designation':'')]; }));
  if(leaving.length) out+=letterPara(++n,
    'The following '+(leaving.length===1?'sewadar stands':'sewadars stand')+' relieved of committee sewa:')+
    letterTable([['Sr.','9%'],['Name','34%'],['Sewa held','22%'],['Reason','35%']],
      leaving.map(function(m,i){ return [String(i+1)+'.', esc(m.name||''), esc(desigFull(m.desig)),
        esc(m.outcome||'')+(m.note?' &mdash; '+esc(m.note):'')]; }));
  var full=staying.map(function(m){ return {n:m.name, g:(m.rec||m.desig), w:'Continuing'}; })
      .concat(ad.map(function(m){ return {n:m.name, g:m.desig, w:'Newly appointed'}; }));
  if(full.length) out+=letterPara(++n,
    'The committee of <b>'+esc(d.place||'the Satsang Place')+'</b>, as approved, shall accordingly read as under:')+
    letterTable([['Sr.','9%'],['Name','40%'],['Sewa','26%'],['Remarks','25%']],
      full.map(function(m,i){ return [String(i+1)+'.', esc(m.n||''), esc(desigFull(m.g)), esc(m.w)]; }));
  if(moved.length||ad.length||leaving.length) out+=letterPara(++n,
    'The particulars above are as recommended on Form SCI-52 filed under this reference, which remains on the office record. '+
    'This letter may be handed to the committee.');
  return out; }

function sum15(it,d){
  var rows=(d.rows||[]).filter(function(r){ return (r.item||'')||(+r.cost||0); }), out='', n=1, tot=0;
  if(!rows.length) return '';
  rows.forEach(function(r){ tot+=(+r.cost||0); });
  out+=letterPara(++n,'The following '+(rows.length===1?'item stands':'items stand')+' <b>sanctioned</b>:')+
    letterTable([['Sr.','9%'],['Particulars','47%'],['Nature','20%'],['Amount (Rs.)','24%']],
      rows.map(function(r,i){ return [String(i+1)+'.', esc(r.item||''), esc(r.nature||''),
        (+r.cost? rupee(+r.cost):'')]; }));
  out+=letterPara(++n,'The total sanctioned against this reference is <b>Rs. '+rupee(tot)+'</b>, '+
    'to be adjusted in the accounts of the Satsang Place in the usual manner.');
  return out; }

function sum02(it,d){
  if(!d||!d.name) return '';
  return letterPara(2,'The appointment of <b>'+esc([d.title,d.name,d.last].filter(Boolean).join(' '))+'</b>, '+
    (d.father?'son / wife of '+esc(d.father)+', ':'')+
    'initiated on '+esc(d.doi||'\u2014')+', stands approved on the particulars furnished on Form SCI-02 filed under this reference.'); }

function changeSummary(it){
  var d52=enclData(it,'SCI-52'); if(d52) return sum52(it,d52);
  var d15=enclData(it,'SCI-15'); if(d15) return sum15(it,d15);
  var d02=enclData(it,'SCI-02'); if(d02) return sum02(it,d02);
  return ''; }

/* ---------- the Approval Letter, on an A4 sheet ---------- */
function approvalLetter(it){
  var a=approvedFor(it.id,'letter'); if(!a) return '<div class="sheet-a4 port"><div class="ftitle">No approval letter</div></div>';
  var decOff=OFF[a.office]||{name:LEVELNAME[it.terminal],short:''};
  var toOff=OFF[it.raiserOff]||{name:LEVELNAME[it.raiser]};
  var chain=ocOf(it), notApp=(a.decision==='Not approved');
  return '<div class="sheet-a4 port">'+
    '<table class="lay"><tr>'+
      '<td style="width:17mm">'+RSSB_LOGO+'</td>'+
      '<td class="ftitle">'+scw('Satsang Centres in India')+'<br>'+scw(decOff.name)+'</td>'+
      '<td class="fno" style="width:30mm">'+(notApp?'NOT APPROVED':'APPROVAL')+'</td></tr></table>'+
    '<table class="lay" style="margin-top:4mm"><tr>'+
      '<td>'+scw('Ref. No.:')+' <b>'+esc(it.id)+'</b></td>'+
      '<td style="text-align:right;width:46mm">'+scw('Date:')+' '+fv(fmt(a.at)+' '+a.at.getFullYear(),'w2')+'</td></tr></table>'+
    '<div style="margin-top:6mm">'+scw('To')+'</div>'+
    '<div>'+scw('The Secretary / Incharge')+'</div>'+
    '<div>'+esc(toOff.name)+'</div>'+
    '<div style="margin-top:6mm"><b>'+scw('Subject:')+' '+esc(titleCase(it.subj))+'</b></div>'+
    '<div style="margin-top:5mm">'+scw('Dear Brother,')+'</div>'+
    '<div style="margin-top:3mm;text-align:justify">'+
      (notApp
        ? 'With reference to your letter cited above under <b>'+esc(it.id)+'</b> on the subject of <b>'+esc(titleCase(it.subj))+'</b>, it is regretted that the proposal <b>has not been approved</b>.'
        : 'With reference to your letter cited above under <b>'+esc(it.id)+'</b> on the subject of <b>'+esc(titleCase(it.subj))+'</b>, approval is hereby <b>accorded</b> as proposed, having been recommended at each level in the reporting line.')+
    '</div>'+
    (a.reason? '<div style="margin-top:3mm">'+scw('Reason:')+' '+esc(a.reason)+'</div>' : '')+
    (notApp? '' : changeSummary(it))+
    ((it.enclosures||[]).length? '<div style="margin-top:4mm">'+scw('The following form(s) stand duly approved and are enclosed:')+
       '<table class="g" style="margin-top:2mm;width:94%;table-layout:fixed"><tr><th style="width:16%">Form</th><th style="width:52%">Particulars</th><th style="width:32%">Reference</th></tr>'+
       it.enclosures.map(function(e){ return '<tr><td class="c">'+esc(e.code)+'</td><td>'+esc(formName(e.code))+'</td><td class="c">'+esc(e.id||it.id)+'</td></tr>'; }).join('')+
       '</table></div>' : '')+
    '<div style="margin-top:4mm">'+scw('This letter is generated by the Dak Handling System on the decision being recorded, and is available to every office in the chain below.')+'</div>'+
    '<table class="lay" style="margin-top:7mm"><tr>'+
      '<td style="vertical-align:bottom;width:64mm">'+stampBox(endOfOffice(it,a.office),true)+'</td>'+
      '<td style="vertical-align:bottom;text-align:right;padding-top:8mm"><span class="sig">'+esc(a.byName)+
        '<br><span style="font-size:8.5pt">'+esc(decOff.name)+'</span></span></td></tr></table>'+
    '<div style="margin-top:3mm;font-size:9pt">'+scw('The stamp above is that of the final approving authority. Verified by one-time code at the time of approval.')+'</div>'+
    '<div class="rule"></div>'+
    '<div style="margin-top:3mm;font-size:9.5pt">'+scw('Distribution')+' &mdash; '+chain.map(function(o){return esc((OFF[o]||{}).name||o);}).join(' &middot; ')+
      ((it.copies&&it.copies.length)? ' &nbsp;|&nbsp; '+scw('Copy')+' &mdash; '+it.copies.map(function(o){return esc((OFF[o]||{}).name||o);}).join(' &middot; ') : '')+'</div>'+
  '</div>';
}

/* ---------- an SCI form with the approval endorsed on it ---------- */
function approvedFormSheet(it, code){
  var a=approvedFor(it.id,'form',code), e=(it.enclosures||[]).filter(function(x){return x.code===code;})[0];
  var data=e? e.data : it.formData;
  if(a && data){ data._end=endorsements(it); data._ref=it.id; }
  var body=a4Sheet(code, data);
  if(!a) return body;
  /* the form keeps its official format untouched; the stamps of every authority
     travel with it on an endorsement page, which is where they are read from */
  return body + endorseSheet(it, code);
}

/* ---------- viewers ---------- */
function openApprovalLetter(dakId){ var it=itemById(dakId); if(!it) return;
  showSheet('Approval Letter &mdash; '+esc(it.id), approvalLetter(it)); }
function openApprovedForm(dakId, code){ var it=itemById(dakId); if(!it) return;
  showSheet(code+' &mdash; duly approved &mdash; '+esc(it.id), approvedFormSheet(it, code)); }

/* ---------- the record screen ---------- */
var APTAB='letters', APQ='';
function setApTab(t){ APTAB=t; go('approved'); }
function setApQ(v){ APQ=v; go('approved'); }
function apMatch(a){ if(!APQ) return true; var it=itemById(a.dakId)||{}; var q=APQ.toLowerCase();
  return (a.dakId||'').toLowerCase().indexOf(q)>=0 || (it.subj||'').toLowerCase().indexOf(q)>=0 || (a.code||'').toLowerCase().indexOf(q)>=0; }
function scrApproved(){
  var all=approvedVisible().filter(apMatch);
  var letters=all.filter(function(a){return a.kind==='letter';}).sort(function(x,y){return y.at-x.at;});
  var forms=all.filter(function(a){return a.kind==='form';}).sort(function(x,y){return y.at-x.at;});
  var rows=(APTAB==='letters'?letters:forms);
  var tabs=[['letters','Approval Letters',letters.length],['forms','Approved SCI Forms',forms.length]];
  var body=rows.length? rows.map(function(a,i){ var it=itemById(a.dakId)||{};
      var notApp=(a.decision==='Not approved');
      return '<div class="row" style="grid-template-columns:40px 150px 96px 1fr 130px 128px 108px;gap:9px;padding:10px 8px;align-items:center">'+
        '<span style="color:var(--mut2);font-size:11px;text-align:right">'+(i+1)+'</span>'+
        '<span class="mono" style="font-size:11px;color:var(--mut)">'+esc(a.dakId)+'</span>'+
        '<span>'+(a.kind==='letter'?'<span class="badge bp">Letter</span>':'<span class="badge bp">'+esc(a.code)+'</span>')+'</span>'+
        '<span style="font-size:12px;color:var(--ink);font-weight:600">'+esc(titleCase(it.subj||''))+'</span>'+
        '<span style="font-size:11px;color:var(--mut)">'+esc((OFF[it.raiserOff]||{}).short||'')+'</span>'+
        '<span><span class="badge '+(notApp?'br':'bg')+'">'+esc(a.decision)+'</span><br><span style="font-size:10px;color:var(--mut2)">'+fmt(a.at)+'</span></span>'+
        '<span style="text-align:right"><button class="btn btns" style="padding:4px 10px;font-size:11px" onclick="'+
          (a.kind==='letter'?('openApprovalLetter(\''+a.dakId+'\')'):('openApprovedForm(\''+a.dakId+'\',\''+a.code+'\')'))+'">Open / print</button></span>'+
      '</div>'; }).join('')
    : '<div style="padding:40px;text-align:center;color:var(--mut2);font-size:12.5px">Nothing yet. An approval letter and a duly approved copy of every enclosed form are written the moment a dak is decided.</div>';
  return '<div class="pt">Approved Records</div>'+
    '<div class="ps">Written by the system on approval &mdash; open to every office on the dak&rsquo;s route</div>'+
    '<div class="dtabs">'+tabs.map(function(t){ return '<span class="dtab'+(APTAB===t[0]?' on':'')+'" onclick="setApTab(\''+t[0]+'\')">'+t[1]+'<span class="dcnt">'+t[2]+'</span></span>'; }).join('')+'</div>'+
    '<div style="display:flex;gap:8px;margin-bottom:10px"><input class="fq" style="flex:1" placeholder="Search by Dak No., subject or form" value="'+esc(APQ)+'" onchange="setApQ(this.value)">'+
      (APQ?'<button class="btn btns" onclick="setApQ(\'\')">Clear</button>':'')+'</div>'+
    '<div class="card" style="padding:0">'+
      '<div class="row" style="grid-template-columns:40px 150px 96px 1fr 130px 128px 108px;gap:9px;padding:8px;background:var(--soft);font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);font-weight:700">'+
        '<span style="text-align:right">S.No</span><span>Dak No.</span><span>Document</span><span>Subject</span><span>Raised by</span><span>Decision</span><span></span></div>'+
      body+'</div>'+
    '<div style="font-size:11.5px;color:var(--mut);margin-top:11px;line-height:1.6">Neither carries a number of its own &mdash; an approval letter and an approved form belong to the dak that produced them, and quote its reference. '+
      'The record is permanent: it is not affected by anything that happens to the dak afterwards.</div>';
}

/* ---------- the approved outputs, shown on the dak itself ---------- */
function approvedCard(it){
  var mine=approvedOf(it); if(!mine.length || !mayOpenApproved(it)) return '';
  var a=mine.filter(function(x){return x.kind==='letter';})[0];

    '<div style="font-size:11.5px;color:var(--mut);margin-bottom:11px">Written automatically when the decision was recorded'+(a?(' by '+esc(a.byName)+' on '+fmt(a.at)):'')+'. Open to every office on this dak.</div>'+
    '<div style="display:flex;gap:9px;flex-wrap:wrap">'+
      (a?'<button class="btn btnp bsm" onclick="openApprovalLetter(\''+it.id+'\')">Approval letter</button>':'')+
      fs.map(function(f){ return '<button class="btn btns bsm" onclick="openApprovedForm(\''+it.id+'\',\''+f.code+'\')">'+esc(f.code)+' &mdash; duly approved</button>'; }).join('')+
    '</div>'+
    '<div style="font-size:11px;color:var(--mut);margin-top:10px;line-height:1.6">The approved form carries the stamp of '+
      endorsements(it).length+' '+(endorsements(it).length===1?'authority':'authorities')+' &mdash; '+
      endorsements(it).map(function(e){ return esc((OFF[e.off]||{}).short||e.off)+' ('+esc(e.act.toLowerCase())+')'; }).join(' &middot; ')+

}

/* ==== TOPICS admin (browse; edit is Stage 5) ==== */
function scrTopics(){
  return '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap"><div>'+
     '<div class="pt">Topics & Workflows</div>'+
     '<div class="ps">The master that drives every dak — '+liveTopics().length+' live topics under '+docTypes().length+' Document Types.'+(isAdmin()?' Editing publishes a new version; dak already in flight keeps the version it started under.':' You may view the workflow of any topic; only the DHS Admin creates or changes them.')+'</div></div>'+
     (isAdmin()?'<button class="btn btnp" onclick="editTopic(-1)">+ Add a topic</button>':'')+'</div>'+
   '<div class="sb" style="margin:0 0 16px"><input id="q2" placeholder="Search a topic…" oninput="reSearch(this.value)"><button class="go" onclick="reSearch(document.getElementById(\'q2\').value)">Search</button></div>'+
   '<div id="results">'+renderResults('',true)+'</div>';
}
var PICKQ='';
function reSearch(v){ PICKQ=v; document.getElementById('results').innerHTML=renderResults(v,true); }
function renderResults(q, admin){
  q=(q||'').trim().toLowerCase();
  var list=liveTopics().filter(function(t){ return !q || (t.dt+' '+t.subj).toLowerCase().indexOf(q)>=0; });
  if(!list.length) return '<div class="empty">No topic matches.</div>';
  var groups=[],gi={};
  list.forEach(function(t){ if(gi[t.dt]===undefined){gi[t.dt]=groups.length;groups.push({dt:t.dt,items:[]});} groups[gi[t.dt]].items.push(t); });
  return groups.map(function(g){ return '<div class="grp"><div class="grph">'+titleCase(g.dt)+' <span class="c">· '+g.items.length+'</span></div>'+
    g.items.slice(0,q?60:6).map(function(t){ var ix=TOPICS.indexOf(t);
      return '<div class="topic" onclick="openTopic('+ix+')"><div><div class="n">'+titleCase(t.subj)+'</div>'+
        '<div class="m">'+originLabel(t.origin)+' · '+modeLabel(t.mode)+' · to '+terminalLabel(t.terminal)+'</div></div>'+
        '<div class="tags">'+topicTags(t)+'</div></div>'; }).join('')+

  var body=rows.map(function(it,i){ var a=wfAge(it), bd=wfBand(a);
    return '<tr><td>'+(i+1)+'</td><td><span class="agepill '+bd[0]+'">'+a+'d</span></td><td>'+titleCase(it.subj)+'<span class="dtag">'+(it.form||titleCase(it.dt).slice(0,14))+'</span></td><td>'+(it.closed?'—':'with '+nowWith(it))+'</td><td><span class="badge '+it.badge+'" style="font-size:9px">'+it.status.split(" · ")[0]+'</span></td></tr>'; }).join('')||'<tr><td colspan="5" style="text-align:center;color:var(--mut2);padding:16px">Nothing pending.</td></tr>';
  return '<div class="ps" style="margin:-8px 0 12px">A single worklist, oldest first — the daily triage view.</div><div class="regsheet"><table class="reg"><tr><th style="width:44px">S.No</th><th style="width:56px">Age</th><th>Subject</th><th style="width:150px">With</th><th style="width:140px">Status</th></tr>'+body+'</table></div>';
}
function wfAgeing(){
  var p=wfPend(), b1=p.filter(function(it){return wfAge(it)<=7;}), b2=p.filter(function(it){var a=wfAge(it);return a>7&&a<=30;}), b3=p.filter(function(it){return wfAge(it)>30;});
  var esc1=p.filter(function(it){return wfAge(it)>30;}).sort(function(a,b){return wfAge(b)-wfAge(a);});
  var list=esc1.map(function(it){return '<div style="display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--bd)"><span style="font-size:12px;color:var(--ink)">'+titleCase(it.subj)+'</span><span style="font-size:11px;color:var(--maroon)">'+(it.closed?'—':nowWith(it))+' · '+wfAge(it)+'d</span></div>';}).join('')||'<div style="font-size:12px;color:var(--mut2);padding:8px 0">Nothing beyond 30 days.</div>';
  return '<div class="rtiles">'+repTile(b1.length,'≤ 7 days','g')+repTile(b2.length,'8–30 days','a')+repTile(b3.length,'&gt; 30 days','r')+'</div>'+
    '<div class="card" style="margin-top:14px"><h3>Escalate — beyond 30 days</h3>'+list+'</div>';
}
function wfWorkload(){
  var p=wfPend(), groups={}; Object.keys(CATS).forEach(function(c){groups[c]=[];}); groups.other=[];
  p.forEach(function(it){ var c=itemCat(it)||'other'; (groups[c]=groups[c]||[]).push(it); });
  var keys=Object.keys(groups).filter(function(k){return groups[k].length;});
  var max=keys.reduce(function(m,k){return Math.max(m,groups[k].length);},1);
  var rows=keys.sort(function(a,b){return groups[b].length-groups[a].length;}).map(function(k){ var g=groups[k], oldest=g.reduce(function(m,it){return Math.max(m,wfAge(it));},0), nm=k==='other'?'Other / general':CATS[k].name;
    return '<div style="margin-bottom:11px"><div style="display:flex;justify-content:space-between;font-size:12px;color:var(--ink);margin-bottom:4px"><span>'+nm+'</span><span style="color:var(--mut)">'+g.length+' · oldest '+oldest+'d</span></div><div style="height:8px;background:var(--soft);border-radius:4px;overflow:hidden"><div style="height:8px;width:'+Math.round(g.length/max*100)+'%;background:'+(oldest>30?'var(--maroon)':'var(--maroon2)')+';border-radius:4px"></div></div></div>'; }).join('')||'<div style="color:var(--mut2);font-size:12px">Nothing pending.</div>';
  return '<div class="ps" style="margin:-8px 0 12px">Pending work by department — count and the oldest item held.</div><div class="card">'+rows+'</div>';
}
var WFTL=null;
function setWFTL(v){ WFTL=v; go('workflow'); }
function wfTimeline(){
  var cands=wfItemsR1().filter(function(it){return it.offChain&&it.offChain.length>1;});
  if(!cands.length) return '<div class="card"><div class="empty">No multi-office dak to trace.</div></div>';
  var sel=cands.filter(function(it){return it.id===WFTL;})[0]||cands[0];
  var reached=(sel.offChain||[]).slice(0, (sel.step||0)+1);
  var total=Math.max(wfAge(sel),reached.length);
  var per=Math.max(1,Math.floor(total/reached.length));
  var bars=reached.map(function(oc,i){ var here=i===sel.step&&!sel.closed; var dur=here?(total-per*(reached.length-1)):per; if(dur<1)dur=1;
    return '<div style="display:flex;align-items:center;gap:9px;margin-bottom:7px"><span style="font-size:11px;color:var(--mut);width:120px">'+(OFF[oc]?OFF[oc].short:oc)+(here?' (now)':'')+'</span><div style="flex:1;height:9px;background:var(--soft);border-radius:5px;overflow:hidden"><div style="height:9px;width:'+Math.min(100,dur/total*100)+'%;background:'+(here?'var(--maroon)':'var(--maroon2)')+'"></div></div><span style="font-size:10px;color:'+(here?'var(--maroon)':'var(--mut2)')+';width:30px">'+dur+'d</span></div>'; }).join('');
  var opts=cands.map(function(it){return '<option value="'+it.id+'"'+(it.id===sel.id?' selected':'')+'>'+titleCase(it.subj)+'</option>';}).join('');
  return '<div class="regbar noprint"><select class="fsel" onchange="setWFTL(this.value)">'+opts+'</select></div>'+
    '<div class="card"><h3>'+titleCase(sel.subj)+' <span style="font-size:11px;color:var(--mut2);font-weight:400">· time held at each office</span></h3><div style="margin-top:10px">'+bars+'</div></div>';
}
function setWFV(v){ WFV=v; if(v==='calendar'&&!WFMON){ var n=new Date(); WFMON=new Date(n.getFullYear(),n.getMonth(),1); } go('workflow'); }
function wfCard(it){ var age=Math.round((new Date()-it.raisedAt)/86400000);
  return '<div class="wcard" onclick="openDak(\''+it.id+'\')">'+
    '<div style="display:flex;justify-content:space-between;gap:6px"><span style="font-size:10px;color:var(--mut2);font-family:ui-monospace,Menlo,monospace">'+it.id+'</span>'+
      '<span style="font-size:10px;color:'+(age>7?'#b45309':'var(--mut2)')+';font-weight:600">'+age+'d</span></div>'+
    '<div style="font-size:12px;font-weight:600;color:var(--ink);margin:4px 0;line-height:1.35">'+titleCase(it.subj)+'</div>'+
    '<div style="display:flex;justify-content:space-between;align-items:center"><span>'+stepDots(it)+'</span>'+
      (it.conf?'<span class="badge bp" style="font-size:9px">Conf</span>':'<span style="font-size:10px;color:var(--mut2)">'+(it.closed?'closed':'with '+nowWith(it))+'</span>')+'</div></div>'; }
function wfBoardR1(){
  var items=wfItemsR1(), b={}; LANES_R1.forEach(function(l){b[l[0]]=[];}); items.forEach(function(it){ b[laneR1(it)].push(it); });
  return '<div style="display:flex;gap:12px;overflow-x:auto;padding-bottom:6px">'+LANES_R1.map(function(l){ var col=b[l[0]];
    return '<div style="flex:0 0 236px;min-width:236px;background:var(--soft);border:1px solid var(--bd);border-radius:11px;padding:11px">'+
      '<div style="display:flex;align-items:center;gap:6px;margin-bottom:9px"><span class="badge '+l[2]+'">'+l[1]+'</span><span style="font-size:11px;color:var(--mut2);font-weight:600">'+col.length+'</span></div>'+
      (col.length?col.map(wfCard).join(''):'<div style="font-size:11px;color:#cbb;padding:8px 2px">nothing here</div>')+'</div>'; }).join('')+'</div>';
}
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var WFDAY=null;
function wfCalR1(){
  var n=WFMON||new Date(); n=new Date(n.getFullYear(),n.getMonth(),1);
  var now=new Date(), isThisMonth=(now.getFullYear()===n.getFullYear()&&now.getMonth()===n.getMonth());
  var pend=calEntries();
  var first=n.getDay(), days=new Date(n.getFullYear(),n.getMonth()+1,0).getDate();
  function onDay(dd){ return pend.filter(function(e){ return e.at.getFullYear()===n.getFullYear()&&e.at.getMonth()===n.getMonth()&&e.at.getDate()===dd; }); }
  function aged(e){ return e.at < new Date(); }
  var cells=[]; for(var i=0;i<first;i++) cells.push(null); for(var dd=1;dd<=days;dd++) cells.push(dd);
  var side=WFDAY!=null?onDay(WFDAY):pend.filter(function(e){return e.at.getMonth()===n.getMonth()&&e.at.getFullYear()===n.getFullYear();});
  side=side.slice().sort(function(a,b){return a.at-b.at;});
  var wk=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  return '<div style="font-size:11px;color:var(--mut);background:var(--soft);border:1px solid var(--bd2);border-radius:8px;padding:9px 12px;margin-bottom:13px;line-height:1.65">'+
     'A dak reaches this Calendar in three ways &mdash; <b>an action-by date</b> carried on the dak (set by the office holding it, or by the raiser), <b>a reminder you set for yourself</b> from the listing or the dak, and <b>a snooze</b>, which is an action-by date you have moved forward. Nothing else appears here.</div>'+
   '<div style="display:flex;gap:10px;align-items:center;margin-bottom:14px">'+
     '<button class="calnav" onclick="wfCalMove(-1)">‹</button>'+
     '<div style="font-weight:800;color:var(--ink);font-size:15px;min-width:150px;text-align:center;letter-spacing:-.01em">'+MON[n.getMonth()]+' '+n.getFullYear()+'</div>'+
     '<button class="calnav" onclick="wfCalMove(1)">›</button>'+
     '<div style="margin-left:auto;display:flex;gap:12px;align-items:center;font-size:10.5px;color:var(--mut2)">'+
       '<span><span class="cdot" style="display:inline-block;vertical-align:middle;margin-right:4px"></span>action by</span>'+
       '<span><span class="cdot aged" style="display:inline-block;vertical-align:middle;margin-right:4px"></span>overdue</span>'+
       '<span><span class="cdot rem" style="display:inline-block;vertical-align:middle;margin-right:4px"></span>my reminder</span></div>'+
   '</div>'+
   '<div style="display:grid;grid-template-columns:1fr 300px;gap:14px;align-items:start">'+
     '<div class="cal"><div class="calhd">'+wk.map(function(w){return '<div>'+w+'</div>';}).join('')+'</div>'+
       '<div class="calgrid">'+cells.map(function(dd){
         if(dd===null) return '<div class="cell empty"></div>';
         var its=onDay(dd), today=isThisMonth&&now.getDate()===dd, sel=WFDAY===dd;
         return '<div class="cell'+(sel?' on':'')+(today?' today':'')+'" onclick="wfCalPick('+dd+')">'+
           '<div class="dn">'+dd+'</div>'+
           (its.length?'<div class="cdots">'+its.slice(0,4).map(function(e){return '<span class="cdot'+(e.kind==='rem'?' rem':(aged(e)?' aged':''))+'"></span>';}).join('')+'</div>'+
             (its.length>4?'<div class="cmore">+'+(its.length-4)+'</div>':''):'')+
         '</div>';
       }).join('')+'</div></div>'+
     '<div class="calside"><div class="csh"><div class="dt">'+(WFDAY!=null?MON[n.getMonth()]+' '+WFDAY:'This month')+'</div>'+
       '<div class="ct">'+side.length+' entr'+(side.length===1?'y':'ies')+(WFDAY!=null?'':' this month')+'</div></div>'+
       '<div class="csb">'+(side.length?side.map(function(e){ var it=e.it, od=e.kind!=='rem' && e.at<new Date();
         return '<div class="cirow" onclick="openDak(\''+it.id+'\')"><div class="s">'+titleCase(it.subj)+(e.kind==='rem'?' <span class="badge bp" style="font-size:8.5px">reminder</span>':'')+'</div>'+
           '<div class="m"><span style="color:'+(od?'var(--maroon)':'var(--mut2)')+'">'+esc(e.label)+' '+fmt(e.at)+(od?' · overdue':'')+'</span><span class="badge '+it.badge+'" style="font-size:9.5px">'+it.status.split(" · ")[0]+'</span></div></div>';
       }).join(''):'<div style="font-size:12px;color:var(--mut2);padding:16px 4px;text-align:center">Nothing due'+(WFDAY!=null?' on this day':'')+'.</div>')+'</div></div>'+
   '</div>';
}
function wfCalMove(dir){ var n=WFMON||new Date(); WFMON=new Date(n.getFullYear(),n.getMonth()+dir,1); WFDAY=null; go('workflow'); }
function wfCalPick(dd){ WFDAY=(WFDAY===dd?null:dd); go('workflow'); }

/* utils */
function esc(s){ return (s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function fmt(x){ var m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; return x.getDate()+' '+m[x.getMonth()]; }
function titleCase(s){ return (s||'').toLowerCase().replace(/\b([a-z])/g,function(m,c){return c.toUpperCase();}).replace(/\bSci\b/g,'SCI').replace(/\bBav\b/g,'BAV').replace(/\bSk\b/g,'SK').replace(/\bSr\b/g,'SR').replace(/\bId\b/g,'ID'); }

boot();
</script>
</body></html>
