<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DHS — R1 Prototype Walkthrough</title>
<style>
  :root{
    --cream:#f6f1e8;--paper:#fffdf9;--ink:#2b2018;--ink2:#6b5d4f;--line:#e4dbcc;
    --maroon:#8B0000;--maroon2:#6b0000;--plum:#7a2e46;--gold:#b8862f;--pink:#F0DDDD;
    --s:#ffffff;--side:#f8f8f8;--mut:#6b7280;--mut2:#9ca3af;--bd:#e5e7eb;--bd2:#d1d5db;--txt:#374151;--dark:#111827;
  }
  *{margin:0;padding:0;box-sizing:border-box;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  html,body{height:100%}
  body{background:#2a231c;display:flex;align-items:center;justify-content:center;overflow:hidden}
  #stage{position:relative;width:1280px;height:720px;background:var(--cream);color:var(--ink);border-radius:12px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.5);transform-origin:center}
  .slide{position:absolute;inset:0;padding:50px 60px;display:none;flex-direction:column}
  .slide.on{display:flex;animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .kicker{font-size:12.5px;letter-spacing:3px;text-transform:uppercase;color:var(--maroon);font-weight:800}
  h1{font-size:50px;line-height:1.06;letter-spacing:-.02em;color:var(--ink);font-weight:800}
  h2{font-size:31px;line-height:1.1;letter-spacing:-.015em;color:var(--ink);font-weight:800}
  .sub{font-size:17px;color:var(--ink2);margin-top:10px;line-height:1.55;max-width:920px}
  .lead{font-size:18px;color:var(--ink2);line-height:1.6;max-width:960px}
  ul.pts{list-style:none;margin-top:16px;display:flex;flex-direction:column;gap:11px}
  ul.pts li{font-size:16px;color:var(--ink);line-height:1.5;padding-left:24px;position:relative}
  ul.pts li::before{content:"";position:absolute;left:0;top:7px;width:11px;height:11px;border-radius:3px;background:var(--maroon)}
  ul.pts li span{color:var(--ink2)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:center;flex:1;margin-top:14px}
  .two.wide{grid-template-columns:0.9fr 1.1fr}
  .foot{position:absolute;left:0;right:0;bottom:0;padding:9px 60px 12px;background:var(--cream);z-index:6;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink2);border-top:1px solid var(--line)}
  .foot span:last-child{padding-left:18px;white-space:nowrap}
  .foot .b{font-weight:800;color:var(--maroon);letter-spacing:1px}
  .chip{display:inline-block;font-size:12px;font-weight:700;background:var(--pink);color:var(--maroon);border-radius:999px;padding:4px 11px;margin-right:6px}
  .chip.g{background:#e7f2e2;color:#3b6d11}.chip.p{background:#efe3ea;color:var(--plum)}
  .app{background:var(--s);border:1px solid var(--bd2);border-radius:12px;overflow:hidden;display:flex;height:100%;box-shadow:0 10px 34px rgba(0,0,0,.14)}
  .app.dark{--s:#201d15;--side:#1a1710;--bd:#35302a;--bd2:#453f34;--txt:#e8e1d0;--dark:#f6f1e6;--mut:#a89f8b;--mut2:#8a8270;--maroon:#cfa14e;--pink:#2a2418;background:#201d15}
  .aside{width:148px;background:var(--side);border-right:1px solid var(--bd);flex-shrink:0;display:flex;flex-direction:column}
  .brand{background:var(--s);text-align:center;padding:10px 8px;border-bottom:3px solid var(--maroon)}
  .brand b{font-size:14px;letter-spacing:2px;color:var(--maroon);font-weight:800}
  .brand span{display:block;font-size:6.5px;letter-spacing:1.4px;color:var(--mut2);text-transform:uppercase;margin-top:2px}
  .who{padding:7px 9px;border-bottom:1px solid var(--bd)}
  .who .n{font-size:10px;font-weight:700;color:var(--dark)}
  .who .r{display:inline-block;font-size:7.5px;font-weight:700;background:var(--pink);color:var(--maroon);border-radius:999px;padding:1px 6px;margin-top:3px}
  .nav{padding:6px 5px;display:flex;flex-direction:column;gap:2px}
  .ni{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--txt);padding:5px 8px;border-radius:6px}
  .ni .ic{width:14px;height:14px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;color:var(--mut2)}
  .ni .ic svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .ni.on{background:var(--pink);color:var(--maroon);font-weight:700}.ni.on .ic{color:var(--maroon)}
  .nl{font-size:7.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--mut);padding:8px 8px 2px;border-top:1px solid var(--bd);margin-top:5px}
  .main{flex:1;padding:15px 18px;overflow:hidden;background:var(--s)}
  .pt{font-size:18px;font-weight:800;color:var(--dark);letter-spacing:-.01em}
  .ps{font-size:11px;color:var(--mut);margin:3px 0 11px}
  .card{background:var(--s);border:1px solid var(--bd2);border-radius:9px;padding:10px 11px;margin-bottom:8px}
  .card h4{font-size:11px;color:var(--dark);margin-bottom:6px;font-weight:700}
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:8px}
  .tile{background:var(--s);border:1px solid var(--bd2);border-radius:8px;padding:8px 9px}
  .tile .n{font-size:18px;font-weight:800;color:var(--dark);line-height:1}
  .tile .l{font-size:8.5px;color:var(--mut);margin-top:3px}
  .tile.a{border-left:3px solid var(--gold)}.tile.g{border-left:3px solid #16a34a}.tile.r{border-left:3px solid var(--maroon)}
  .btnp{background:var(--maroon);color:#fff;border-radius:6px;font-size:9.5px;font-weight:700;padding:5px 10px;display:inline-block}
  .btns{background:var(--s);color:var(--maroon);border:1px solid var(--bd2);border-radius:6px;font-size:9.5px;font-weight:700;padding:5px 10px;display:inline-block}
  .app.dark .btnp{color:#1a1710}
  .bd{font-size:8px;font-weight:700;border-radius:4px;padding:1px 6px;display:inline-block}
  .bd.ba{background:#e0e7ff;color:#3730a3}.bd.bb{background:#e5edff;color:#1e40af}.bd.bg{background:#dcfce7;color:#166534}.bd.bgy{background:#f1f1f1;color:#555}.bd.br{background:#fee2e2;color:#991b1b}.bd.bp{background:#efe3fb;color:#6d28d9}
  .row{display:grid;grid-template-columns:80px 1fr 100px 60px;gap:9px;align-items:center;font-size:11px;padding:9px 5px;border-bottom:1px solid var(--bd);color:var(--txt)}
  .row .s{font-weight:600;color:var(--dark)}
  .dact{width:24px;height:24px;border:1px solid var(--bd2);border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:var(--mut);background:var(--s)}
  .dact svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .dact.ok{color:#166534;border-color:#bbf7d0;background:#f0fdf4}
  .tabs{display:flex;gap:3px;border-bottom:1px solid var(--bd);margin-bottom:9px;flex-wrap:wrap}
  .tab{font-size:11px;padding:6px 9px;color:var(--mut);border-bottom:2px solid transparent}
  .tab.on{color:var(--maroon);border-color:var(--maroon);font-weight:700}
  .kanban{display:flex;gap:7px}
  .kcol{flex:1;background:#faf8f6;border:1px solid var(--bd);border-radius:8px;padding:7px;min-width:0}
  .app.dark .kcol{background:#2a2418}
  .kcol .h{font-size:8.5px;font-weight:700;margin-bottom:6px}
  .kc{background:var(--s);border:1px solid var(--bd);border-radius:6px;padding:6px;margin-bottom:5px}
  .kc .t{font-size:9px;color:var(--dark);font-weight:600}.kc .m{font-size:7.5px;color:var(--mut2);margin-top:2px}
  .agepill{font-size:8px;font-weight:700;border-radius:4px;padding:1px 6px}
  .agepill.ok{background:#dcfce7;color:#166534}.agepill.warn{background:#fef3c7;color:#92400e}.agepill.bad{background:#fee2e2;color:#991b1b}
  .sheet{border:1px solid var(--bd2);border-radius:6px;background:var(--s);overflow:hidden}
  .sheeth{position:relative;text-align:center;padding:8px 40px 6px;border-bottom:2px solid var(--maroon)}
  .sheeth .o{font-size:6.5px;letter-spacing:2px;text-transform:uppercase;color:var(--mut)}
  .sheeth .t{font-size:10.5px;font-weight:800;color:var(--dark);margin-top:2px}
  .sheeth .no{position:absolute;top:7px;right:9px;border:1.5px solid var(--bd2);border-radius:4px;padding:2px 6px;font-size:8.5px;font-weight:800;color:var(--dark)}
  .sheetb{padding:9px 11px}
  .sec{font-size:7.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--maroon);margin:7px 0 4px}
  table.ft{width:100%;border-collapse:collapse;font-size:8px}
  table.ft th{text-align:left;font-size:6.5px;text-transform:uppercase;color:var(--mut);padding:3px 4px;border-bottom:1.5px solid var(--bd2)}
  table.ft td{padding:3px 4px;border-bottom:1px solid var(--bd);color:var(--txt)}
  .fld .l{font-size:6.5px;text-transform:uppercase;color:var(--mut);font-weight:700}.fld .v{border-bottom:1px solid var(--bd2);padding:3px 1px;color:var(--dark);font-size:9px}
  .sheet.big{box-shadow:0 12px 34px rgba(0,0,0,.16)}
  .sheet.big .sheeth{padding:13px 54px 10px}
  .sheet.big .sheeth .o{font-size:9px;letter-spacing:2.5px}
  .sheet.big .sheeth .t{font-size:17px}
  .sheet.big .sheeth .no{font-size:12.5px;padding:3px 10px;top:11px;right:13px}
  .sheet.big .sheetb{padding:16px 20px}
  .sheet.big .sec{font-size:10.5px;margin:13px 0 7px}
  .sheet.big table.ft{font-size:12px}
  .sheet.big table.ft th{font-size:8.5px;padding:6px}
  .sheet.big table.ft td{padding:8px 6px}
  .sheet.big .fld .l{font-size:8.5px}
  .sheet.big .fld .v{font-size:13.5px;padding:7px 2px}
  .sheet.big .grid2{gap:15px}
  .pdfnote{margin-top:12px;display:inline-flex;align-items:center;gap:9px;font-size:13px;color:var(--ink2);background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:9px 14px}
  .pdfnote b{color:var(--ink)}
  .pdfbadge{font-size:10px;font-weight:800;letter-spacing:.5px;color:#fff;background:var(--maroon);border-radius:5px;padding:3px 8px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .node{background:var(--paper);border:1.5px solid var(--maroon);color:var(--maroon);border-radius:8px;padding:9px 14px;font-size:14px;font-weight:700;text-align:center}
  .node.g{border-color:var(--ink2);color:var(--ink2)}
  .ar{color:var(--maroon);font-size:20px}
  .callout{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--maroon);border-radius:8px;padding:15px 17px;font-size:14.5px;color:var(--ink);line-height:1.5}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-top:15px}
  .box{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:17px}
  .box .bt{font-size:15px;font-weight:800;color:var(--maroon)}
  .box p{font-size:13px;color:var(--ink2);margin-top:6px;line-height:1.45}
  .cov{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
  .cov .col{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:15px 17px}
  .cov h3{font-size:15px;color:var(--ink)}
  .cov ul{list-style:none;margin-top:8px;display:flex;flex-direction:column;gap:6px}
  .cov li{font-size:12.5px;color:var(--ink);padding-left:19px;position:relative;line-height:1.4}
  .cov li::before{content:"✓";position:absolute;left:0;color:#3b6d11;font-weight:800}
  .cov.plan li::before{content:"○";color:var(--gold)}
  .phone{width:210px;height:410px;border:8px solid #2b2018;border-radius:26px;background:var(--s);margin:0 auto;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.25)}
  .phone .ph{background:var(--maroon);color:#fff;padding:12px 12px 10px;font-size:11px;font-weight:700}
  .phb{padding:10px}
  .mcard{border:1px solid var(--bd);border-radius:8px;padding:8px;margin-bottom:7px;font-size:9px}
  .mcard .t{font-weight:700;color:var(--dark)}.mcard .m{color:var(--mut2);font-size:8px;margin-top:2px}
  .mchk{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--maroon);background:var(--maroon);color:#fff;font-size:9px;display:inline-flex;align-items:center;justify-content:center;float:right}
  #dots{position:absolute;top:13px;left:50%;transform:translateX(-50%);display:flex;gap:5px;z-index:7;flex-wrap:wrap;max-width:64%;justify-content:center}
  #dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.28);cursor:pointer}
  #dots i.on{background:#fff;width:16px;border-radius:3px}
  .navbtn{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.35);color:#fff;border:0;font-size:22px;cursor:pointer;z-index:5;opacity:.5}
  .navbtn:hover{opacity:1}#prev{left:14px}#next{right:14px}
  #hint{position:absolute;top:12px;right:16px;font-size:11px;color:rgba(255,255,255,.5);z-index:5}
</style></head>
<body>
<div id="stage"></div>
<button class="navbtn" id="prev">‹</button>
<button class="navbtn" id="next">›</button>
<div id="dots"></div>
<div id="hint">← → navigate · F fullscreen</div>
<script>
var NAVICO={
 dash:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg>',
 dak:'<svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3.6" cy="6" r="1"/><circle cx="3.6" cy="12" r="1"/><circle cx="3.6" cy="18" r="1"/></svg>',
 work:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="10" rx="1.5"/><rect x="17" y="4" width="4" height="13" rx="1.5"/></svg>',
 forms:'<svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><line x1="8" y1="8" x2="16" y2="8"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="8" y1="16" x2="13" y2="16"/></svg>',
 reg:'<svg viewBox="0 0 24 24"><path d="M2 4h6a3 3 0 0 1 3 3v13a2.5 2.5 0 0 0-2.5-2.5H2z"/><path d="M22 4h-6a3 3 0 0 0-3 3v13a2.5 2.5 0 0 1 2.5-2.5H22z"/></svg>',
 rep:'<svg viewBox="0 0 24 24"><line x1="6" y1="20" x2="6" y2="13"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="18" y1="20" x2="18" y2="9"/><line x1="3" y1="20" x2="21" y2="20"/></svg>',
 top:'<svg viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6"/><circle cx="9" cy="6" r="1.9"/><line x1="4" y1="12" x2="20" y2="12"/><circle cx="15" cy="12" r="1.9"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="8" cy="18" r="1.9"/></svg>'
};
function nav(active){
  var items=[['dash','Dashboard'],['dak','Dak Listing'],['LBL','Oversight'],['work','Workflow'],['forms','SCI Forms'],['reg','Registers'],['rep','Reports'],['LBL','Administration'],['top','Topics & Workflows']];
  return items.map(function(x){ if(x[0]==='LBL') return '<div class="nl">'+x[1]+'</div>';
    return '<div class="ni'+(x[0]===active?' on':'')+'"><span class="ic">'+(NAVICO[x[0]]||'')+'</span>'+x[1]+'</div>'; }).join('');
}
var ACTICO={
 reply:'<svg viewBox="0 0 24 24"><path d="M9 17l-5-5 5-5"/><path d="M4 12h11a5 5 0 0 1 5 5v1"/></svg>',
 forward:'<svg viewBox="0 0 24 24"><path d="M15 17l5-5-5-5"/><path d="M20 12H9a5 5 0 0 0-5 5v1"/></svg>',
 approve:'<svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>',
 putup:'<svg viewBox="0 0 24 24"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>',
 remind:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
 track:'<svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="2.6"/></svg>',
 unread:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>'
};
function dact(k){ return '<span class="dact'+(k==='approve'?' ok':'')+'">'+ACTICO[k]+'</span>'; }
function actLegend(){ var L=[['reply','Reply'],['forward','Forward'],['approve','Approve'],['putup','Put up'],['remind','Set a reminder'],['unread','Mark unread']];
  return '<div style="display:flex;gap:22px;align-items:center;margin-top:14px;flex-wrap:wrap">'+L.map(function(a){ return '<span style="display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--ink)">'+dact(a[0])+a[1]+'</span>'; }).join('')+'</div>'; }
function app(o){ o=o||{};
  return '<div class="app'+(o.dark?' dark':'')+'">'+
    '<div class="aside"><div class="brand"><b>DHS</b><span>Dak Handling · R1</span></div>'+
    '<div class="who"><div class="n">'+(o.user||'Sh. Balwinder Kakkar')+'</div><div class="r">'+(o.role||'Signing Authority')+'</div></div>'+
    '<div class="nav">'+nav(o.active||'dash')+'</div></div>'+
    '<div class="main">'+(o.main||'')+'</div></div>';
}
var S=[];

/* 1 title */
S.push('<div class="slide" style="justify-content:center;align-items:flex-start">'+
  '<div class="kicker">For all Zones and the SCI Office · all-India</div>'+
  '<h1 style="margin-top:16px">DHS — Dak Handling System</h1>'+
  '<div class="sub" style="font-size:22px;margin-top:14px">A single, topic-driven system for official correspondence, approvals and records —<br>across every Zone and the SCI Office.</div>'+
  '<div style="margin-top:26px"><span class="chip">Topic-driven</span><span class="chip p">Role-based</span><span class="chip">SCI forms</span><span class="chip g">Office-scoped</span></div>'+
  '<div class="foot"><span class="b">DHS · R1</span><span>First demoable prototype — walkthrough</span></div></div>');

/* 2 problem */
var ICO_DOC='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8B0000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><line x1="8" y1="8" x2="16" y2="8"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="8" y1="16" x2="13" y2="16"/></svg>';
var ICO_HEAD='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8B0000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.4"/><path d="M5.5 20a6.5 6.5 0 0 1 13 0"/></svg>';
var ICO_EYE='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8B0000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="2.6"/></svg>';
var ICO_NET='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8B0000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.3"/><circle cx="18" cy="6" r="2.3"/><circle cx="12" cy="18" r="2.3"/><path d="M7.8 7.4 10.6 15.8M16.2 7.4 13.4 15.8M8.3 6h7.4"/></svg>';
function pcard(ico,t,d){ return '<div style="background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:flex;gap:15px;align-items:flex-start">'+
  '<div style="width:42px;height:42px;border-radius:11px;background:var(--pink);display:flex;align-items:center;justify-content:center;flex-shrink:0">'+ico+'</div>'+
